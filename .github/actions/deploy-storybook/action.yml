name: 'Deploy Storybook to dufs'
description: 'Build and deploy Storybook to dufs server'

inputs:
  branch-name:
    description: 'Branch name to use for deployment path'
    required: true
  comment-pr:
    description: 'Whether to comment on PR (only works for PR events)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for PR comments'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup yarn
      shell: bash
      run: npm install -g yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Build project
      shell: bash
      run: yarn build

    - name: Build Storybook
      shell: bash
      run: |
        cd packages/eagle
        yarn build-storybook

    - name: Upload to dufs
      shell: bash
      run: |
        STORYBOOK_DIR="packages/eagle/storybook-static"
        TARGET_URL="http://file.smtx.io/cloudtower-ui-kit/${{ inputs.branch-name }}/"
        find $STORYBOOK_DIR -type f | while read file; do
          curl -T "$file" "${TARGET_URL}${file#$STORYBOOK_DIR/}"
        done

    - name: Comment PR
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const storybookUrl = 'http://file.smtx.io/cloudtower-ui-kit/${{ inputs.branch-name }}/index.html';
          const body = `📚 Storybook has been deployed!\n\n🔗 Preview URL: ${storybookUrl}\n\nBranch: \`${{ inputs.branch-name }}\``;
          
          // Check if comment already exists
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('Storybook has been deployed')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

