name: 'Deploy Storybook to Vercel'
description: 'Build and deploy Storybook to Vercel'

inputs:
  branch-name:
    description: 'Branch name to use for deployment path'
    required: true
  comment-pr:
    description: 'Whether to comment on PR (only works for PR events)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
  vercel-token:
    description: 'Vercel token for deployment'
    required: true
  vercel-project-id:
    description: 'Vercel project ID'
    required: true
  vercel-org-id:
    description: 'Vercel organization ID'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup yarn
      shell: bash
      run: npm install -g yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Build project
      shell: bash
      run: yarn build

    - name: Build Storybook
      shell: bash
      run: |
        cd packages/eagle
        yarn build-storybook

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      id: vercel-deploy
      with:
        github-token: ${{ inputs.github-token || github.token }}
        vercel-token: ${{ inputs.vercel-token }}
        vercel-project-id: ${{ inputs.vercel-project-id }}
        vercel-org-id: ${{ inputs.vercel-org-id }}
        vercel-args: '--prod'
        working-directory: packages/eagle/storybook-static
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

