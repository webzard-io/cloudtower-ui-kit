name: storybook

on:
  push:
    branches: ["main", "next"]

jobs:
  storybook-deploy:
    name: Deploy Storybook to dufs
    runs-on: [self-hosted]
    strategy:
      matrix:
        node: [20]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Deploy Storybook
        uses: ./.github/actions/deploy-storybook
        with:
          branch-name: ${{ github.ref_name }}
          comment-pr: 'false'

