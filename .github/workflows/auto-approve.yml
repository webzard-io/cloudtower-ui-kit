name: Auto Approve on LGTM
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  auto-approve:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'LGTM')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, 'LGTM'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number || github.event.issue.number }}
