name: "Storybook Cleanup"

on:
  pull_request:
    types: [closed]

jobs:
  storybook-cleanup:
    name: Cleanup Storybook from dufs
    runs-on: [self-hosted]
    if: github.event.pull_request.merged == true
    steps:
      - name: Cleanup from dufs
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          TARGET_URL="http://file.smtx.io/cloudtower-ui-kit/${BRANCH_NAME}/"
          curl -X DELETE "${TARGET_URL}" || echo "Failed to delete ${TARGET_URL}"
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = '${{ github.event.pull_request.head.ref }}';
            const body = `🧹 Storybook preview has been cleaned up.\n\nBranch: \`${branchName}\``;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

