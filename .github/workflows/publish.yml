name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "UI kit theme preview version"
        required: true
        default: "0.0.0-theme-rc-1"
        type: string
  # When Release Pull Request is merged
  pull_request:
    branches:
      - main
      - "v*-dev"
      - "v*-stable"
    types: [closed]

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    name: Publish on Node ${{ matrix.node }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 15
      - name: Build
        run: yarn build
      - name: Copy Readme
        run: |
          cp ./README.md packages/eagle/README.md
      - name: Set Current Version
        run: |
          CURRENT_VERSION=$(node -p 'require("./lerna.json").version')
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
      - name: Tag Check
        id: tag_check
        run: |
          GET_API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${CURRENT_VERSION}"
          http_status_code=$(curl -LI $GET_API_URL -o /dev/null -w '%{http_code}\n' -s \
            -H "Authorization: token ${GITHUB_TOKEN}")
          if [ "$http_status_code" -ne "404" ] ; then
            echo "exists_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists_tag=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Check
        id: package_check
        run: |
          set -eu
          ./node_modules/.bin/lerna list --toposort --json --loglevel silent > /tmp/publish-packages.json
          node -e '
            const fs = require("fs");
            const path = require("path");
            const packages = JSON.parse(fs.readFileSync("/tmp/publish-packages.json", "utf8"));
            for (const pkg of packages) {
              const manifest = require(path.resolve(pkg.location, "package.json"));
              if (manifest.private) continue;
              console.log(`${pkg.location}\t${manifest.name}\t${manifest.version}`);
            }
          ' > /tmp/publish-list.tsv
          has_unpublished_packages=false
          while IFS="$(printf '\t')" read -r location name version; do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Found ${name}@${version}"
            else
              echo "Need publish ${name}@${version}"
              has_unpublished_packages=true
            fi
          done < /tmp/publish-list.tsv
          echo "has_unpublished_packages=${has_unpublished_packages}" >> "$GITHUB_OUTPUT"
      - name: Create Git Tag
        if: steps.tag_check.outputs.exists_tag == 'false'
        uses: pkgdeps/git-tag-action@v2
        with:
          version: ${{ env.CURRENT_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"
      - name: Setup npm trusted publishing
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with OIDC support
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Publish
        uses: nick-fields/retry@v2
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        with:
          timeout_minutes: 10 # 设置超时时间，单位为分钟
          max_attempts: 3 # 设置最大重试次数
          command: |
            set -eu
            dist_tag="release-${CURRENT_VERSION%%.*}"
            ./node_modules/.bin/lerna list --toposort --json --loglevel silent > /tmp/publish-packages.json
            node -e '
              const fs = require("fs");
              const path = require("path");
              const packages = JSON.parse(fs.readFileSync("/tmp/publish-packages.json", "utf8"));
              for (const pkg of packages) {
                const manifest = require(path.resolve(pkg.location, "package.json"));
                if (manifest.private) continue;
                console.log(`${pkg.location}\t${manifest.name}\t${manifest.version}`);
              }
            ' > /tmp/publish-list.tsv
            while IFS="$(printf '\t')" read -r location name version; do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "Skip ${name}@${version}: already published"
              else
                echo "Publish ${name}@${version} with tag ${dist_tag}"
                npm publish "${location}" --access public --tag "${dist_tag}"
              fi
            done < /tmp/publish-list.tsv
      - name: Get Output
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: publish-output-v${{ env.CURRENT_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: create-publish-pr.yml
          workflow_conclusion: success
      - name: Read the output
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        run: |
          echo "SLACK_USER=$(cat output.txt)" >> $GITHUB_ENV
      - name: Send to Slack
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          # This data can be any valid JSON from a previous step in the GitHub Action
          link_names: 1
          payload: |
            {
              "text": "Get New Version At ${{ env.CURRENT_VERSION }} <http://npmjs.com/package/@cloudtower/eagle|${{ env.CURRENT_VERSION }}> <@${{ env.SLACK_USER }}>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Build Changelog
        id: github_release
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
              "categories": [
                {
                    "title": "## 🚀 Features",
                    "labels": ["feat"]
                },
                {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix"]
                },
                {
                    "title": "## 🧪 Tests",
                    "labels": ["test"]
                },
                {
                    "title": "## 💬 Other",
                    "labels": ["other", "chore"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: softprops/action-gh-release@v1
        with:
          body: ${{steps.github_release.outputs.changelog}}
          tag_name: "v${{ env.CURRENT_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-theme-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/theme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Setup package managers
        run: npm install -g yarn npm@^11.5.1
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 15
      - name: Set workspace preview versions
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const version = process.env.PREVIEW_VERSION;
          if (!/^0\.0\.0-theme-rc-[1-9]\d*$/.test(version)) {
            throw new Error("Expected 0.0.0-theme-rc-N");
          }
          const path = require("path");
          const files = fs.readdirSync("packages").map(dir => path.join("packages", dir, "package.json"));
          const packages = files.map(file => [file, JSON.parse(fs.readFileSync(file, "utf8"))]);
          const names = new Set(packages.map(([, manifest]) => manifest.name));
          for (const [file, manifest] of packages) {
            manifest.version = version;
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              for (const name of Object.keys(manifest[field] ?? {})) {
                if (names.has(name)) manifest[field][name] = version;
              }
            }
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          }
          const lerna = JSON.parse(fs.readFileSync("lerna.json", "utf8"));
          lerna.version = version;
          fs.writeFileSync("lerna.json", JSON.stringify(lerna, null, 2) + "\n");
          JS
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test:ci
      - name: Check package contents
        run: |
          cp README.md packages/eagle/README.md
          npm pack ./packages/eagle --dry-run --json > /tmp/eagle-preview-pack.json
          node <<'JS'
          const fs = require("fs");
          const pack = JSON.parse(fs.readFileSync("/tmp/eagle-preview-pack.json", "utf8"))[0];
          for (const file of ["dist/style.css", "dist/token.css", "dist/esm/index.js", "dist/src/index.d.ts"]) {
            if (!pack.files.some(item => item.path === file)) throw new Error(`Missing ${file}`);
          }
          if (pack.files.some(item => item.path.endsWith(".scss"))) throw new Error("Unexpected Sass publication");
          console.log(`${pack.name}@${pack.version}: ${pack.files.length} files checked`);
          JS
      - name: Check workspace package contents
        run: |
          ./node_modules/.bin/lerna list --toposort --json --loglevel silent > /tmp/theme-packages.json
          node <<'JS'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const packages = JSON.parse(fs.readFileSync("/tmp/theme-packages.json", "utf8"));
          for (const pkg of packages) {
            const manifest = JSON.parse(fs.readFileSync(`${pkg.location}/package.json`, "utf8"));
            const pack = JSON.parse(execFileSync("npm", ["pack", pkg.location, "--dry-run", "--json"], { encoding: "utf8" }))[0];
            for (const entry of [manifest.main, manifest.module, manifest.types].filter(Boolean)) {
              if (!pack.files.some(file => file.path === entry.replace(/^\.\//, ""))) throw new Error(`${pkg.name}: missing ${entry}`);
            }
            console.log(`${pkg.name}@${pkg.version}: checked`);
          }
          JS
      - name: Publish workspace previews
        run: |
          node <<'JS'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const packages = JSON.parse(fs.readFileSync("/tmp/theme-packages.json", "utf8"));
          for (const pkg of packages) {
            const manifest = JSON.parse(fs.readFileSync(`${pkg.location}/package.json`, "utf8"));
            if (manifest.private) continue;
            execFileSync("npm", ["publish", "--access", "public", "--tag", "theme", "--provenance"], { cwd: pkg.location, stdio: "inherit" });
          }
          JS
