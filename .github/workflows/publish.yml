name: publish
on:
  # When Release Pull Request is merged
  pull_request:
    branches:
      - main
      - "v*-dev"
      - "v*-stable"
    types: [closed]

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    name: Publish on Node ${{ matrix.node }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 15
      - name: Build
        run: yarn build
      - name: Copy Readme
        run: |
          cp ./README.md packages/eagle/README.md
      - name: Set Current Version
        run: |
          CURRENT_VERSION=$(node -p 'require("./lerna.json").version')
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
      - name: Tag Check
        id: tag_check
        run: |
          GET_API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${CURRENT_VERSION}"
          http_status_code=$(curl -LI $GET_API_URL -o /dev/null -w '%{http_code}\n' -s \
            -H "Authorization: token ${GITHUB_TOKEN}")
          if [ "$http_status_code" -ne "404" ] ; then
            echo "exists_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists_tag=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Check
        id: package_check
        run: |
          set -eu
          ./node_modules/.bin/lerna list --toposort --json --loglevel silent > /tmp/publish-packages.json
          node -e '
            const fs = require("fs");
            const path = require("path");
            const packages = JSON.parse(fs.readFileSync("/tmp/publish-packages.json", "utf8"));
            for (const pkg of packages) {
              const manifest = require(path.resolve(pkg.location, "package.json"));
              if (manifest.private) continue;
              console.log(`${pkg.location}\t${manifest.name}\t${manifest.version}`);
            }
          ' > /tmp/publish-list.tsv
          has_unpublished_packages=false
          while IFS="$(printf '\t')" read -r location name version; do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Found ${name}@${version}"
            else
              echo "Need publish ${name}@${version}"
              has_unpublished_packages=true
            fi
          done < /tmp/publish-list.tsv
          echo "has_unpublished_packages=${has_unpublished_packages}" >> "$GITHUB_OUTPUT"
      - name: Create Git Tag
        if: steps.tag_check.outputs.exists_tag == 'false'
        uses: pkgdeps/git-tag-action@v2
        with:
          version: ${{ env.CURRENT_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"
      - name: Setup npm trusted publishing
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with OIDC support
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Publish
        uses: nick-fields/retry@v2
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        with:
          timeout_minutes: 10 # 设置超时时间，单位为分钟
          max_attempts: 3 # 设置最大重试次数
          command: |
            set -eu
            ./node_modules/.bin/lerna list --toposort --json --loglevel silent > /tmp/publish-packages.json
            node -e '
              const fs = require("fs");
              const path = require("path");
              const packages = JSON.parse(fs.readFileSync("/tmp/publish-packages.json", "utf8"));
              for (const pkg of packages) {
                const manifest = require(path.resolve(pkg.location, "package.json"));
                if (manifest.private) continue;
                console.log(`${pkg.location}\t${manifest.name}\t${manifest.version}`);
              }
            ' > /tmp/publish-list.tsv
            while IFS="$(printf '\t')" read -r location name version; do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "Skip ${name}@${version}: already published"
              else
                echo "Publish ${name}@${version}"
                npm publish "${location}" --access public
              fi
            done < /tmp/publish-list.tsv
      - name: Get Output
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: publish-output-v${{ env.CURRENT_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: create-publish-pr.yml
          workflow_conclusion: success
      - name: Read the output
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        run: |
          echo "SLACK_USER=$(cat output.txt)" >> $GITHUB_ENV
      - name: Send to Slack
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          # This data can be any valid JSON from a previous step in the GitHub Action
          link_names: 1
          payload: |
            {
              "text": "Get New Version At ${{ env.CURRENT_VERSION }} <http://npmjs.com/package/@cloudtower/eagle|${{ env.CURRENT_VERSION }}> <@${{ env.SLACK_USER }}>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Build Changelog
        id: github_release
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
              "categories": [
                {
                    "title": "## 🚀 Features",
                    "labels": ["feat"]
                },
                {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix"]
                },
                {
                    "title": "## 🧪 Tests",
                    "labels": ["test"]
                },
                {
                    "title": "## 💬 Other",
                    "labels": ["other", "chore"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: steps.package_check.outputs.has_unpublished_packages == 'true'
        uses: softprops/action-gh-release@v1
        with:
          body: ${{steps.github_release.outputs.changelog}}
          tag_name: "v${{ env.CURRENT_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
