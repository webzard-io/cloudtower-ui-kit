name: Sync Icons

env:
  SYNC_ICON_RESULT_PATH: /tmp/sync-icon-result.json
  PR_BODY_PATH: /tmp/pr-body.md
  SLACK_DESCRIPTION_PATH: /tmp/slack-description.txt

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      description:
        description: "Description for the sync action"
        required: false
      slack_user:
        description: "Slack user ID to notify (e.g., U123456)"
        required: false
      figma_ids:
        description: "Force-update existing icons. Comma-separated Figma node ids from icon-map.json keys, e.g. 7374:56758,7202:49694"
        required: false
  # 外部 dispatch 触发
  repository_dispatch:
    types: [sync-icons]
  # 定时执行：每天 UTC 时间 0:00（北京时间 8:00）
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync-icon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Sync Icons
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FORCE_SYNC_IDS: ${{ inputs.figma_ids || github.event.client_payload.figma_ids || '' }}
        run: yarn workspace @cloudtower/icons sync-icons
      - name: Bundlewatch icons
        run: yarn workspace @cloudtower/icons build-icons && yarn bundlewatch ./packages/icons/dist/**/*.svg --max-size 6kb
      - name: Build pull request body
        env:
          DESCRIPTION: ${{ inputs.description || github.event.client_payload.description || 'Scheduled sync' }}
        run: node .github/scripts/build-sync-result-desc.mjs
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[SYNC-ICON]: update icons"
          committer: netweng <xiaojun@smartx.com>
          author: netweng <xiaojun@smartx.com>
          delete-branch: true
          branch-suffix: short-commit-hash
          title: "[SYNC-ICON]: update icons"
          labels: feat
          body-path: ${{ env.PR_BODY_PATH }}
      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
      - name: Set Slack User
        id: set_slack_user
        run: |
          SLACK_USER="${{ inputs.slack_user || github.event.client_payload.slack_user || '' }}"
          if [ -n "$SLACK_USER" ]; then
            echo "slack_user_mention=<@$SLACK_USER>" >> $GITHUB_OUTPUT
          else
            echo "slack_user_mention=" >> $GITHUB_OUTPUT
          fi
      - name: Build Slack Payload
        if: ${{ steps.cpr.outputs.pull-request-number }}
        id: build_payload
        run: |
          DESCRIPTION="${{ inputs.description || github.event.client_payload.description || 'Scheduled sync' }}"
          PR_URL="${{ steps.cpr.outputs.pull-request-url }}"
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          SLACK_USER_MENTION="${{ steps.set_slack_user.outputs.slack_user_mention }}"
          SLACK_DESCRIPTION=""
          if [ -s "$SLACK_DESCRIPTION_PATH" ]; then
            SLACK_DESCRIPTION="$(cat "$SLACK_DESCRIPTION_PATH")"
          fi

          TEXT="🎨 Icons Synced! New PR created: <${PR_URL}|#${PR_NUMBER}>"$'\n'"${DESCRIPTION} ${SLACK_USER_MENTION}"
          if [ -n "$SLACK_DESCRIPTION" ]; then
            TEXT="${TEXT}"$'\n'"${SLACK_DESCRIPTION}"
          fi

          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          echo "payload<<EOF" >> $GITHUB_OUTPUT
          echo "$PAYLOAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Send to Slack
        if: ${{ steps.cpr.outputs.pull-request-number }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          link_names: 1
          payload: ${{ steps.build_payload.outputs.payload }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
