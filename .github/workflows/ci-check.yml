name: "CI Check"

on:
  pull_request:
    branches: ["main", "v4.1"]

jobs:
  label-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16]
    name: Check PR Label
    steps:
      - uses: jesusvasquez333/verify-pr-label-action@v1.4.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          valid-labels: "feat, fix, chore"
          pull-request-number: "${{ github.event.pull_request.number }}"


  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16]
    name: Run Test on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 3
      - name: Build
        run: yarn build
      - name: Bundle Watch
        uses: jackyef/bundlewatch-gh-action@master
        with:
          bundlewatch-github-token: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}
      - name: Test parrot
        run: yarn workspace @cloudtower/parrot run test:ci
      - name: Test eagle
        run: yarn workspace @cloudtower/eagle run test:ci


  storybook-staging:
    name: Setup Storybook Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set Up Storybook Staging
        uses: amondnet/vercel-action@v20
        id: vercel-action-staging
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
