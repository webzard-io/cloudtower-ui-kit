name: "CI Check"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: 
      - '**'

# Cancel prev CI if new commit come
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # label-check:
  #   runs-on: [self-hosted]
  #   name: Check PR Label
  #   steps:
  #     - uses: jesusvasquez333/verify-pr-label-action@v1.4.0
  #       with:
  #         github-token: "${{ secrets.GITHUB_TOKEN }}"
  #         valid-labels: "feat, fix, chore, breaking change, refactor, enhancement, doc, storybook"
  #         pull-request-number: "${{ github.event.pull_request.number }}"

  test:
    runs-on: [self-hosted]
    strategy:
      matrix:
        node: [20]
    name: Run Test on Node ${{ matrix.node }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 15
      - name: Build
        run: yarn build
      - name: Bundlewatch
        run: yarn bundlewatch
      - name: Test
        run: yarn test:ci
  storybook-deploy:
    name: Deploy Storybook to dufs
    runs-on: [self-hosted]
    if: github.event.action != 'closed'
    strategy:
      matrix:
        node: [20]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Deploy Storybook
        uses: ./.github/actions/deploy-storybook
        with:
          branch-name: ${{ github.head_ref }}
          comment-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
  
  storybook-cleanup:
    name: Cleanup Storybook from dufs
    runs-on: [self-hosted]
    if: github.event.action == 'closed'
    steps:
      - name: Cleanup from dufs
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          TARGET_URL="http://file.smtx.io/cloudtower-ui-kit/${BRANCH_NAME}/"
          curl -X DELETE "${TARGET_URL}" || echo "Failed to delete ${TARGET_URL}"
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = '${{ github.event.pull_request.head.ref }}';
            const body = `🧹 Storybook preview has been cleaned up.\n\nBranch: \`${branchName}\``;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
