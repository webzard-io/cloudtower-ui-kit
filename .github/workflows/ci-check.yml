name: "CI Check"

on:
  pull_request:
    branches: 
      - '**'

# Cancel prev CI if new commit come
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-check:
    runs-on: [self-hosted, linux]
    name: Check PR Label
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          any_of: "feat,fix,chore,breaking change,refactor,enhancement,doc,storybook"

  test:
    runs-on: [self-hosted, linux]
    strategy:
      matrix:
        node: [20]
    name: Run Test on Node ${{ matrix.node }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 15
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test:ci
  storybook-staging:
    name: Setup Storybook Staging
    runs-on: [self-hosted, linux]
    strategy:
      matrix:
        node: [20]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Set alias-domains variable
        id: set-alias-domains
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" == "next" ]; then
            echo "alias-domains=next-cloudtower-uikit.vercel.app" >> $GITHUB_ENV
          fi
      - name: Set Up Storybook Staging
        uses: amondnet/vercel-action@v20
        id: vercel-action-staging
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN_V2 }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_V2 }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID_V2 }}
          alias-domains: ${{ env.alias-domains }}
