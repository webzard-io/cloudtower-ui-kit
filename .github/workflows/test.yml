name: test

on:
  push:
    branches: ["main", "TOWER-**"]
  workflow_dispatch:

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/TOWER')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16]
    name: Test on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"
      - name: Install deps
        run: yarn install --frozen-lockfile
        timeout-minutes: 3
      - name: Test
        run: cd packages/eagle && yarn run test:ci
