query checkUserByName($where: UserWhereInput, $first: Int = 1) {
  users(where: $where, first: $first) {
    id
  }
}

query getUserInfo($where: UserWhereUniqueInput!) {
  user(where: $where) {
    id
    username
    role
    roles {
      id
      preset
      name
    }
    name
    email_address
    mobile_phone
  }
}

mutation login($data: LoginInput!) {
  login(data: $data) {
    token
  }
}

query my {
  my {
    user {
      id
      username
      name
      email_address
      mobile_phone
      role
      roles {
        id
        name
        actions
        preset
      }
      source
      password_recover_qa {
        enabled
        items {
          question
        }
      }
      password_updated_at
    }
  }
}

mutation createRootUser($root_password: String!, $now: DateTime!) {
  createUser(
    data: {
      name: "root"
      source: LOCAL
      role: ROOT
      username: "root"
      password: $root_password
      password_recover_qa: { enabled: false, items: [] }
      password_updated_at: $now
    }
  ) {
    id
  }
}

mutation createUser($data: UserCreateInput!) {
  createUser(data: $data) {
    id
  }
}

mutation updateUser(
  $data: UserUpdateInput!
  $where: UserWhereUniqueInput!
  $effect: UpdateUserEffect!
) {
  updateUser(data: $data, where: $where, effect: $effect) {
    id
    username
    role
    roles {
      id
      name
    }
    name
    email_address
    mobile_phone
    source
    password_recover_qa {
      enabled
      items {
        question
      }
    }
    password_updated_at
  }
}

mutation deleteUser($where: UserWhereUniqueInput!) {
  deleteUser(where: $where) {
    id
  }
}

query usernames {
  users {
    id
    username
  }
}

mutation logout {
  logout
}

query usersPasswordRecoverQuestions($where: UserWhereInput!) {
  users(where: $where) {
    id
    password_recover_qa {
      enabled
      items {
        question
      }
    }
  }
}

query usersLoginInfo($userWhere: UserWhereInput!) {
  userLoginInfoes(where: { user: $userWhere }) {
    id
    miss_num
    missed_at
    locked_at
  }
}

mutation resetPassword($data: ResetPasswordInput!) {
  resetPassword(data: $data) {
    password_updated_at
  }
}

mutation heartbeat {
  heartbeat
}
