query nfsInode($where: NfsInodeWhereUniqueInput!) {
  nfsInode(where: $where) {
    id
    local_id
    name
    parent_id
  }
}

query nfsInodeName($where: NfsInodeWhereUniqueInput!) {
  nfsInode(where: $where) {
    id
    name
  }
}

query nfsInodeInfo($where: NfsInodeWhereUniqueInput!) {
  nfsInode(where: $where) {
    id
    local_id
    assigned_size
    unique_size
    shared_size
    file
    replica_num
    thin_provision
    nfs_export {
      id
      thin_provision
      replica_num
      cluster {
        id
        name
      }
    }
  }
}

mutation batchUpdateNfsInode($data: batchUpdateNfsInodeInput!) {
  batchUpdateNfsInode(data: $data) {
    taskId
  }
}
