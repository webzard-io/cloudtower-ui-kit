query vmTemplate($where: VmTemplateWhereUniqueInput!) {
  vmTemplate(where: $where) {
    id
    cluster {
      id
      version
      type
      stretch
    }
    name
    vcpu
    description
    cpu {
      cores
      sockets
    }
    memory
    ha
    firmware
    clock_offset
    cpu_model
    win_opt
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    vm_disks {
      boot
      type
      bus
      path
      size
      disk_name
      elf_image_local_id
      vm_volume_local_id
      svt_image_local_id
      index
      disabled
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
    }
    vm_nics {
      index
      mac_address
      enabled
      mirror
      model
      vlan {
        vlan_local_id
        vlan_id
      }
    }
    cloud_init_supported
  }
}

query vmTemplateName($where: VmTemplateWhereUniqueInput!) {
  vmTemplate(where: $where) {
    id
    name
  }
}

query vmTemplateNameAndCluster($where: VmTemplateWhereUniqueInput!) {
  vmTemplate(where: $where) {
    id
    name
    description
    cloud_init_supported
    entityAsyncStatus
    cluster {
      id
      version
      type
      connect_state
      disconnected_reason
      disconnected_date
    }
  }
}

query vmTemplateInfo($where: VmTemplateWhereUniqueInput!) {
  vmTemplate(where: $where) {
    id
    size
    local_created_at
    description
    cloud_init_supported
    vcpu
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    cpu {
      cores
      sockets
    }
    memory
    ha
    firmware
    vm_disks {
      boot
      type
      size
      path
      bus
      elf_image_local_id
      vm_volume_local_id
      svt_image_local_id
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      disabled
    }
    vm_nics {
      ip_address
      mac_address
      vlan {
        vlan_local_id
      }
    }
    cpu_model
    clock_offset
    win_opt
    video_type
    cluster {
      id
      type
      version
      name
      stretch
      datacenters {
        id
        name
      }
    }
  }
}

query vmTemplateDiskName(
  $vmVolumesWhere: VmVolumeWhereInput!
  $elfImagesWhere: ElfImageWhereInput!
  $svtImagesWhere: SvtImageWhereInput!
  $skipVmVolumes: Boolean!
  $skipElfImages: Boolean!
  $skipSvtImages: Boolean!
) {
  vmVolumes(where: $vmVolumesWhere) @skip(if: $skipVmVolumes) {
    id
    local_id
    name
  }
  elfImages(where: $elfImagesWhere) @skip(if: $skipElfImages) {
    id
    local_id
    name
  }
  svtImages(where: $svtImagesWhere) @skip(if: $skipSvtImages) {
    id
    local_id
    name
  }
}

mutation createVmTemplate(
  $data: VmTemplateCreateInput!
  $effect: CreateVmTemplateEffect!
) {
  createVmTemplate(data: $data, effect: $effect) {
    id
  }
}

mutation updateVmTemplate(
  $where: VmTemplateWhereUniqueInput!
  $data: VmTemplateUpdateInput!
) {
  updateVmTemplate(where: $where, data: $data) {
    id
    name
    description
    cloud_init_supported
    entityAsyncStatus
  }
}

mutation deleteVmTemplate($where: VmTemplateWhereUniqueInput!) {
  deleteVmTemplate(where: $where) {
    id
    entityAsyncStatus
  }
}

query checkVmTemplateByName($name: String!, $clusterId: ID!) {
  vmTemplates(where: { name: $name, cluster: { id: $clusterId } }, first: 1) {
    id
  }
}

query getVmBelongToSnapshotPlan($where: VmWhereUniqueInput!) {
  vm(where: $where) {
    id
    name
    snapshot_plan {
      id
      name
    }
  }
}

mutation parseOvfFile($cluster: ClusterWhereUniqueInput!, $raw: String!) {
  parseOVFFile(cluster: $cluster, raw: $raw) {
    name
    description
    vcpu
    cpu {
      cores
      sockets
    }
    memory
    nics {
      mac
    }
    disks {
      name
      bus
      type
      size
    }
    firmware
  }
}

mutation importVmTemplate(
  $data: VmTemplateCreateInput!
  $effect: ImportVmTemplateEffect!
) {
  importVmTemplate(data: $data, effect: $effect) {
    id
  }
}
