query zoneBasic($where: ZoneWhereUniqueInput!) {
  zone(where: $where) {
    id
    local_id
    is_preferred
    datacenter {
      name
      id
    }
    cluster {
      name
      ip
      id
      type
      hypervisor
      architecture
      stretch
      pmem_enabled
      version
      connect_state
      disconnected_reason
      disconnected_date
    }
  }
}

mutation updateZone($data: ZoneUpdateInput!, $where: ZoneWhereUniqueInput!) {
  updateZone(data: $data, where: $where) {
    id
    datacenter {
      id
    }
  }
}

query getZonesIsPreferred($where: ZoneWhereInput!) {
  zones(where: $where) {
    id
    local_id
    is_preferred
  }
}

query getZoneCluster($where: ZoneWhereInput!) {
  zones(where: $where) {
    id
    cluster {
      id
      hypervisor
    }
  }
}
