subscription everouteCluster {
  everouteCluster {
    mutation
    node {
      id
      status {
        phase
        conditions {
          type
          lastProbeTime
        }
        controllers {
          instances {
            isHealth
          }
        }
        agents {
          instances {
            hostID
            isHealth
            phase
          }
          manageVDSes {
            vdsID
            phase
          }
        }
      }
    }
  }
}

query getEverouteLicenses {
  everouteLicenses {
    id
    serial
    software_edition
    type
    max_socket_num
    sign_date
    expire_date
  }
}

mutation parseEverouteLicense($license: String!) {
  parseEverouteLicense(license: $license) {
    id
    uid
    serial
    software_edition
    type
    max_socket_num
    sign_date
    expire_date
  }
}

mutation updateEverouteLicense(
  $where: EverouteLicenseWhereUniqueInput!
  $license: String!
) {
  updateEverouteLicense(where: $where, license: $license) {
    id
    uid
    serial
    software_edition
    type
    max_socket_num
    sign_date
    expire_date
  }
}

query getEverouteClusters($where: EverouteClusterWhereInput) {
  everouteClusters(where: $where) {
    id
    name
    phase
    status {
      conditions {
        type
        lastProbeTime
      }
      controllers {
        instances {
          isHealth
          metrics {
            cpuUsage
            memoryUsage
            dataVolumeUsage
          }
          vm {
            id
            name
            host {
              id
              name
            }
            cluster {
              id
              name
              architecture
            }
            vm_nics {
              id
              vlan {
                id
                name
              }
            }
          }
        }
      }
      agents {
        instances {
          hostID
          isHealth
          phase
          host {
            id
            name
            cluster {
              id
              name
            }
          }
        }
        manageVDSes {
          vds {
            id
            name
            cluster {
              id
              name
              connect_state
              disconnected_date
            }
          }
          phase
        }
      }
    }
    version
    installed
    agent_elf_clusters {
      id
      name
      connect_state
      disconnected_date
      total_cpu_sockets
    }
    agent_elf_vdses {
      id
      name
      cluster {
        id
      }
    }
  }
}

query getEverouteClusterById($where: EverouteClusterWhereUniqueInput!) {
  everouteCluster(where: $where) {
    id
    name
    phase
    installed
    status {
      conditions {
        type
        lastProbeTime
      }
      controllers {
        instances {
          isHealth
          metrics {
            cpuUsage
            memoryUsage
            dataVolumeUsage
          }
          vm {
            id
            name
            host {
              id
              name
            }
            cluster {
              id
              name
              architecture
            }
            vm_nics {
              id
              vlan {
                id
                name
              }
            }
          }
        }
      }
      agents {
        instances {
          hostID
          isHealth
          phase
          host {
            id
            name
            cluster {
              id
              name
            }
          }
        }
        manageVDSes {
          phase
          vds {
            id
            name
            cluster {
              id
              name
              connect_state
              disconnected_date
            }
          }
          phase
        }
      }
    }
    version
    agent_elf_clusters {
      id
      name
      total_cpu_sockets
      connect_state
    }
    agent_elf_vdses {
      id
      name
      cluster {
        id
      }
    }
    global_default_action
    global_whitelist {
      enable
      egress {
        ip_block
        except_ip_block
        ports {
          port
          protocol
        }
      }
      ingress {
        ip_block
        except_ip_block
        ports {
          port
          protocol
        }
      }
    }
  }
}

mutation deleteEverouteCluster($where: EverouteClusterWhereUniqueInput!) {
  deleteEverouteCluster(where: $where) {
    id
  }
}

query getEverouteClusterAgentClusters(
  $where: EverouteClusterWhereUniqueInput!
) {
  everouteCluster(where: $where) {
    id
    agent_elf_clusters {
      id
      name
    }
  }
}

query getEverouteClusterGlobalAction($where: EverouteClusterWhereUniqueInput!) {
  everouteCluster(where: $where) {
    id
    global_default_action
    global_whitelist {
      enable
      egress {
        ip_block
        except_ip_block
        ports {
          port
          protocol
        }
      }
      ingress {
        ip_block
        except_ip_block
        ports {
          port
          protocol
        }
      }
    }
  }
}

mutation updateEverouteClusterGlobalAction(
  $where: EverouteClusterWhereUniqueInput!
  $data: EverouteClusterUpdateInput!
) {
  updateEverouteCluster(where: $where, data: $data) {
    id
    global_default_action
  }
}

query getEveroutePackages {
  everoutePackages {
    id
    name
    version
    arch
  }
}

mutation deleteEveroutePackage($where: EveroutePackageWhereUniqueInput!) {
  deleteEveroutePackage(where: $where) {
    id
  }
}

mutation updateEverouteClusterAssociation(
  $where: EverouteClusterWhereUniqueInput!
  $data: EverouteClusterUpdateInput!
) {
  updateEverouteCluster(where: $where, data: $data) {
    id
  }
}

query getEverouteClusterAgentVdses($where: EverouteClusterWhereUniqueInput!) {
  everouteCluster(where: $where) {
    id
    agent_elf_vdses {
      id
      name
      cluster {
        id
      }
    }
    status {
      agents {
        manageVDSes {
          vds {
            id
            name
            cluster {
              id
            }
          }
          phase
        }
      }
    }
  }
}

mutation deployEverouteCluster(
  $data: EverouteClusterCreateInput!
  $effect: CreateEverouteClusterEffectInput!
) {
  createEverouteCluster(data: $data, effect: $effect) {
    id
    name
  }
}

mutation createEveroutePackage($data: EveroutePackageCreateInput!) {
  createEveroutePackage(data: $data) {
    id
    upload_task {
      id
      chunk_size
      current_chunk
    }
  }
}

mutation uploadEveroutePackage($data: UploadEveroutePackageInput!) {
  uploadEveroutePackage(data: $data) {
    id
    status
    size
    chunk_size
    current_chunk
    resource_type
    args
    started_at
    updatedAt
    finished_at
  }
}

query getSecurityPolicies {
  securityPolicies {
    id
    everoute_cluster {
      id
    }
    apply_to {
      selector_ids
      selector {
        id
        key
        value
        vms {
          id
          name
          cluster {
            id
            name
            everoute_cluster {
              id
              name
            }
          }
          labels {
            id
            key
            value
          }
          vm_nics {
            id
            vlan {
              id
              name
              vds {
                id
                name
                everoute_cluster {
                  id
                  name
                }
              }
            }
          }
        }
      }
    }
  }
}

query getVmsInIsolation($where: VmWhereInput) {
  vms(where: $where) {
    id
    isolation_policy {
      id
      mode
    }
  }
}

query getAllAgentClusters($where: ClusterWhereInput) {
  clusters(where: $where) {
    id
    name
    architecture
    everoute_cluster {
      id
      name
      version
    }
  }
}

query getEverouteClusterControllerInstances($everouteClusterId: ID!) {
  everouteCluster(where: { id: $everouteClusterId }) {
    id
    name
    controller_template {
      netmask
      gateway
    }
    status {
      controllers {
        instances {
          vmID
          isHealth
          ipAddr
          metrics {
            cpuUsage
            memoryUsage
            dataVolumeUsage
          }
          vm {
            id
            name
            ips
            vcpu
            size
            memory
            cluster {
              id
              name
            }
            host {
              id
              name
            }
            vm_nics {
              id
              vlan {
                id
                name
              }
            }
            in_recycle_bin
            vm_disks {
              vm_volume {
                name
                size
              }
            }
          }
        }
      }
    }
  }
}

mutation upgradeEverouteCluster(
  $where: EverouteClusterWhereUniqueInput!
  $effect: UpdateEverouteClusterEffectInput
) {
  updateEverouteCluster(where: $where, data: {}, effect: $effect) {
    id
    name
  }
}

query getAllEverouteClustersVersion {
  everouteClusters {
    id
    name
    version
  }
}
