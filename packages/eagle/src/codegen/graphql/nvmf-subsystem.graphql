query nvmfSubsystemBasic($where: NvmfSubsystemWhereUniqueInput!) {
  nvmfSubsystem(where: $where) {
    id
    name
    policy
    entityAsyncStatus
    cluster {
      id
      name
      version
      type
      connect_state
      disconnected_reason
      disconnected_date
      datacenters {
        id
        name
      }
    }
  }
}

query nvmfSubsystemDetail($id: ID!) {
  nvmfSubsystem(where: { id: $id }) {
    id
    local_id
    name
    policy
    replica_num
    thin_provision
    ip_whitelist
    nqn_whitelist
    nqn_name
    stripe_num
    stripe_size
    description
    iops
    iops_rd
    iops_wr
    bps
    bps_rd
    bps_wr
    iops_max
    iops_max_length
    iops_rd_max
    iops_rd_max_length
    iops_wr_max
    iops_wr_max_length
    bps_max
    bps_max_length
    bps_rd_max
    bps_rd_max_length
    bps_wr_max
    bps_wr_max_length
    namespaces {
      id
      replica_num
    }
    cluster {
      id
      ip
      type
      version
      connect_state
    }
  }

  nvmfNamespaceSnapshots(where: { nvmf_subsystem: { id: $id } }) {
    id
  }

  iscsiConnections(where: { nvmf_subsystem: { id: $id } }) {
    id
    initiator_ip
  }
}

mutation createNvmfSubsystem($data: NvmfSubsystemCreateInput!) {
  createNvmfSubsystem(data: $data) {
    id
  }
}

query checkNvmfSubsystemName($clusterId: ID!, $name: String!) {
  nvmfSubsystems(
    where: { name: $name, cluster: { id: $clusterId } }
    first: 1
  ) {
    id
  }
  iscsiTargets(where: { name: $name, cluster: { id: $clusterId } }, first: 1) {
    id
  }
  nfsExports(where: { name: $name, cluster: { id: $clusterId } }, first: 1) {
    id
  }
}

mutation updateNvmfSubsystem(
  $data: NvmfSubsystemUpdateInput!
  $where: NvmfSubsystemWhereUniqueInput!
) {
  updateNvmfSubsystem(data: $data, where: $where) {
    id
    name
  }
}

query editNvmfSubsystemInfo($where: NvmfSubsystemWhereUniqueInput!) {
  nvmfSubsystem(where: $where) {
    id
    name
    nqn_name
    description
    ip_whitelist
    nqn_whitelist
    iops
    iops_rd
    iops_wr
    bps
    bps_rd
    bps_wr
    iops_max
    iops_max_length
    iops_rd_max
    iops_rd_max_length
    iops_wr_max
    iops_wr_max_length
    bps_max
    bps_max_length
    bps_rd_max
    bps_rd_max_length
    bps_wr_max
    bps_wr_max_length
    replica_num
    cluster {
      id
      version
      type
    }
  }
}

query nvmfNamespaceAndSnapshotAndGroupConnection($id: ID!) {
  nvmfNamespacesConnection(where: { nvmf_subsystem: { id: $id } }) {
    aggregate {
      count
    }
  }
  nvmfNamespaceSnapshotsConnection(where: { nvmf_subsystem: { id: $id } }) {
    aggregate {
      count
    }
  }
  namespaceGroupsConnection(where: { nvmf_subsystem: { id: $id } }) {
    aggregate {
      count
    }
  }
}

mutation deleteNvmfSubsystem($where: NvmfSubsystemWhereUniqueInput!) {
  deleteNvmfSubsystem(where: $where) {
    id
  }
}

query checkNvmfSubsystemNum($where: NvmfSubsystemWhereInput!) {
  nvmfSubsystems(where: $where) {
    id
  }
}

query nvmfSubsystemsFromConsistencyGroup($where: NvmfSubsystemWhereInput) {
  nvmfSubsystems(where: $where, orderBy: name_ASC) {
    id
    name
    namespaces(orderBy: name_ASC) {
      id
      name
      consistency_group {
        id
        name
      }
    }
  }
}

query nvmfSubsystemsCount($where: ClusterWhereInput!) {
  nvmfSubsystemsConnection(where: { cluster: $where }) {
    aggregate {
      count
    }
  }
}
