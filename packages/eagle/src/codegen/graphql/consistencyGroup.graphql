query consistencyGroupInfo($where: ConsistencyGroupWhereUniqueInput!) {
  consistencyGroup(where: $where) {
    id
    name
    local_id
    description
    unique_size
    entityAsyncStatus
    cluster {
      id
      name
      connect_state
      disconnected_reason
      disconnected_date
    }
    iscsi_luns {
      id
      name
      iscsi_target {
        id
        name
      }
    }
    namespaces {
      id
      name
      nvmf_subsystem {
        id
        name
      }
    }
    local_created_at
    consistency_group_snapshots {
      id
      name
      entityAsyncStatus
    }
  }
}

query consistencyGroupCount($where: ConsistencyGroupWhereInput!) {
  consistencyGroups(where: $where) {
    id
    name
  }
}

query checkConsistencyGroupByName($name: String!, $clusterId: ID!) {
  consistencyGroups(
    where: { name: $name, cluster: { id: $clusterId } }
    first: 1
  ) {
    id
  }
}

mutation createConsistencyGroup($data: ConsistencyGroupCreateInput!) {
  createConsistencyGroup(data: $data) {
    id
    name
  }
}

mutation updateConsistencyGroup(
  $where: ConsistencyGroupWhereUniqueInput!
  $data: ConsistencyGroupUpdateInput!
  $effect: UpdateConsistencyGroupEffect
) {
  updateConsistencyGroup(data: $data, where: $where, effect: $effect) {
    id
    name
    entityAsyncStatus
  }
}

mutation deleteConsistencyGroup(
  $where: ConsistencyGroupWhereUniqueInput!
  $effect: DeleteConsistencyGroupEffect
) {
  deleteConsistencyGroup(where: $where, effect: $effect) {
    id
  }
}

query snapshotAndGroupConnection($id: ID!) {
  nvmfNamespaceSnapshotsConnection(
    where: { consistency_group_snapshot: { consistency_group: { id: $id } } }
  ) {
    aggregate {
      count
    }
  }
  iscsiLunSnapshotsConnection(
    where: { consistency_group_snapshot: { consistency_group: { id: $id } } }
  ) {
    aggregate {
      count
    }
  }
}
