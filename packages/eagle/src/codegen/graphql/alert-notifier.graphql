query smtpServer($where: AlertNotifierWhereInput) {
  alertNotifiers(where: $where, first: 1) {
    id
    smtp_server_host
    smtp_server_port
    security_mode
    username
  }
}

query alertEmailInfo($where: AlertNotifierWhereInput) {
  alertNotifiers(where: $where, first: 1) {
    id
    smtp_server_host
    disabled
    email_from
    email_tos
    language_code
    notice_severities
  }
}

mutation updateAlertNotifier(
  $data: AlertNotifierUpdateInput!
  $where: AlertNotifierWhereUniqueInput!
) {
  updateAlertNotifier(data: $data, where: $where) {
    id
    smtp_server_host
    smtp_server_port
    security_mode
    disabled
    email_from
    email_tos
    language_code
    notice_severities
  }
}
