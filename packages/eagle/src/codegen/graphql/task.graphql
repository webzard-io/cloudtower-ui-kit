query getTasks($where: TaskWhereInput) {
  tasks(where: $where) {
    id
    steps {
      key
      finished
    }
    progress
    started_at
    finished_at
    status
    snapshot
    description
    error_message
    cluster {
      id
      name
      version
      type
      architecture
    }
    user {
      id
    }
    args
    resource_mutation
    internal
  }
}

subscription task {
  task {
    mutation
    node {
      id
      steps {
        key
        finished
        current
        total
        per_second
      }
      progress
      started_at
      finished_at
      status
      snapshot
      description
      error_code
      error_message
      cluster {
        id
        name
        version
        type
        architecture
      }
      user {
        id
      }
      args
      resource_mutation
      resource_id
      internal
    }
    previousValues {
      id
      status
    }
  }
}

query getTaskPosition($before: String, $order: TaskOrderByInput) {
  tasksConnection(
    before: $before
    orderBy: $order
    where: { internal: false }
  ) {
    aggregate {
      count
    }
  }
}

query taskTable(
  $where: TaskWhereInput
  $orderBy: TaskOrderByInput
  $skip: Int
  $first: Int
) {
  tasks(where: $where, orderBy: $orderBy, skip: $skip, first: $first) {
    id
    description
    status
    snapshot
    steps {
      key
      finished
      current
      total
      per_second
    }
    progress
    local_created_at
    started_at
    finished_at
    error_code
    error_message
    cluster {
      id
      name
      version
      type
      architecture
    }
    user {
      id
      name
    }
    args
    internal
    resource_mutation
  }
  tasksConnection(where: $where) {
    aggregate {
      count
    }
  }
}

