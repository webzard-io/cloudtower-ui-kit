query taskStatusCount {
  pending: tasksConnection(where: { status: PENDING, internal: false }) {
    aggregate {
      count
    }
  }
  executing: tasksConnection(where: { status: EXECUTING, internal: false }) {
    aggregate {
      count
    }
  }
  failed: tasksConnection(where: { status: FAILED, internal: false }) {
    aggregate {
      count
    }
  }
  successed: tasksConnection(where: { status: SUCCESSED, internal: false }) {
    aggregate {
      count
    }
  }
  progress_collect: tasks(where: { status: EXECUTING, internal: false }) {
    progress
  }
}

query taskDetail($where: TaskWhereUniqueInput!) {
  task(where: $where) {
    local_created_at
    status
    finished_at
    started_at
    description
    steps {
      key
      finished
    }
    id
    snapshot
    progress
    error_code
    error_message
    cluster {
      id
      name
    }
  }
}

