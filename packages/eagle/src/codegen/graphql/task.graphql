mutation updateTask(
  $where: TaskWhereUniqueInput!
  $data: TaskUpdateInput!
  $effect: UpdateTaskEffect
) {
  updateTask(where: $where, data: $data, effect: $effect) {
    id
    status
  }
}

query getTaskForAscensionReplica($where: TaskWhereUniqueInput!) {
