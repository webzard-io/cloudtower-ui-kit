query securityPolicyNameAndDescription(
  $where: SecurityPolicyWhereUniqueInput!
) {
  securityPolicy(where: $where) {
    id
    name
    description
    policy_mode
    everoute_cluster {
      id
      name
      phase
      version
      status {
        conditions {
          type
          lastProbeTime
        }
        controllers {
          instances {
            isHealth
            metrics {
              cpuUsage
              memoryUsage
              dataVolumeUsage
            }
            vm {
              id
              name
              host {
                id
                name
              }
              cluster {
                id
                name
                architecture
              }
              vm_nics {
                id
                vlan {
                  id
                  name
                }
              }
            }
          }
        }
        agents {
          instances {
            hostID
            isHealth
            phase
            host {
              id
              name
              cluster {
                id
                name
              }
            }
          }
          manageVDSes {
            vds {
              id
              name
              cluster {
                id
                name
                connect_state
                disconnected_date
              }
            }
            phase
          }
        }
      }
    }
  }
}

query checkNameOfSecurityPolicyExists($name: String, $id: ID) {
  securityPolicies(where: { name: $name, id_not: $id }) {
    id
  }
}

query labelVmsInEveroute($labelIds: [ID!], $everouteClusterId: ID!) {
  labels(where: { id_in: $labelIds }) {
    id
    vms(
      where: {
        cluster: { everoute_cluster: { id: $everouteClusterId } }
        vm_nics_every: {
          vlan: { vds: { everoute_cluster: { id: $everouteClusterId } } }
        }
      }
    ) {
      id
      name
    }
  }
}

query getSecurityPoliciesNum {
  securityPoliciesConnection {
    aggregate {
      count
    }
  }
}

query vmsForSecurityPolicy($where: VmWhereInput!) {
  vms(where: $where) {
    id
    name
    cluster {
      id
      name
      everoute_cluster {
        id
        name
      }
    }
    vm_nics {
      id
      vlan {
        id
        vds {
          id
          everoute_cluster {
            id
            name
          }
        }
      }
    }
  }
}

