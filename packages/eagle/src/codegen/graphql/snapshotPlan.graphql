query snapshotPlanInfo($where: SnapshotPlanWhereUniqueInput!) {
  snapshotPlan(where: $where) {
    id
    name
    object_num
    snapshot_group_num
    logical_size_bytes
    cluster {
      id
      name
      stretch
      connect_state
      disconnected_reason
      disconnected_date
      datacenters {
        id
        name
      }
    }
    status
    auto_execute_num
    manual_execute_num
    auto_delete_num
    manual_delete_num
    start_time
    end_time
    last_execute_status
    last_execute_time
    last_execute_end_time
    next_execute_time
    execute_plan_type
    physical_size_bytes
    remain_snapshot_num
    execute_intervals
  }
}

query snapshotPlanEdit($where: SnapshotPlanWhereUniqueInput!) {
  snapshotPlan(where: $where) {
    id
    name
    cluster {
      id
    }
    vms {
      id
    }
    start_time
    end_time
    exec_h_m
    execute_plan_type
    remain_snapshot_num
    execute_intervals
  }
}

query getVms($where: VmWhereInput) {
  vms(where: $where) {
    id
    name
    vm_disks {
      id
      vm_volume {
        id
        sharing
      }
    }
  }
}

query cloneSnapshotGroupVmInfo($where: SnapshotGroupWhereUniqueInput!) {
  snapshotGroup(where: $where) {
    id
    vm_info {
      vm_id
      vm_name
      vm_snapshot_status
      disks {
        disk_id
        disk_snapshot_status
      }
    }
    cluster {
      id
      version
      type
    }
  }
}

query rollbackSnapshotGroup($snapshotGroupId: ID!, $snapshotPlanId: ID!) {
  snapshotGroup(where: { id: $snapshotGroupId }) {
    id
    vm_info {
      vm_id
      vm_name
      vm_snapshot_status
      disks {
        disk_id
        disk_snapshot_status
      }
    }
  }

  snapshotPlan(where: { id: $snapshotPlanId }) {
    id
    vms {
      id
      local_id
    }
  }
}

query rollbackVms(
  $vmLocalId: [String!]
  $volumeLocalId: [String!]
  $mounting: Boolean!
) {
  vms(where: { local_id_in: $vmLocalId }) {
    id
    local_id
    status
    vm_disks {
      id
      vm_volume {
        id
        local_id
      }
    }
  }
  vmVolumes(where: { local_id_in: $volumeLocalId, mounting: $mounting }) {
    id
    local_id
  }
}

query checkVmName($where: VmWhereInput, $first: Int = 1) {
  vms(where: $where, first: $first) {
    id
    name
  }
}

query checkSnapshotPlanName($where: SnapshotPlanWhereInput, $first: Int = 1) {
  snapshotPlans(where: $where, first: $first) {
    id
    name
  }
}

query checkSnapshotGroupName($where: SnapshotGroupWhereInput, $first: Int = 1) {
  snapshotGroups(where: $where, first: $first) {
    id
    name
  }
}

query getExecuteTask($where: SnapshotPlanTaskWhereInput, $first: Int = 1) {
  snapshotPlanTasks(where: $where, first: $first) {
    id
  }
}

mutation createSnapshotPlan($data: SnapshotPlanCreateInput!) {
  createSnapshotPlan(data: $data) {
    id
  }
}

mutation updateSnapshotPlan(
  $data: SnapshotPlanUpdateInput!
  $where: SnapshotPlanWhereUniqueInput!
  $effect: UpdateSnapshotPlanEffect
) {
  updateSnapshotPlan(data: $data, where: $where, effect: $effect) {
    id
  }
}

mutation deleteSnapshotPlan($where: SnapshotPlanWhereUniqueInput!) {
  deleteSnapshotPlan(where: $where) {
    id
  }
}

mutation updateSnapshotGroup(
  $data: SnapshotGroupUpdateInput!
  $where: SnapshotGroupWhereUniqueInput!
  $effect: UpdateSnapshotGroupEffect
) {
  updateSnapshotGroup(data: $data, where: $where, effect: $effect) {
    id
  }
}

mutation deleteSnapshotGroup($where: SnapshotGroupWhereUniqueInput!) {
  deleteSnapshotGroup(where: $where) {
    id
  }
}
