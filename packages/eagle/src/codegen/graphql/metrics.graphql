query metrics($input: MetricsInput!) {
  metrics(input: $input) {
    sample_streams {
      labels {
        _cluster
        _chunk
        serial_number
        _vm
        _volume
        _host
        _device
        _service
        _mac
        _scvm
        _witness
        to_hostname
        instance
        _network
        _to_uuid
        _zone
        name
        metric_name
      }
      points {
        t
        v
      }
    }
    samples {
      labels {
        _cluster
        _chunk
        serial_number
        _vm
        _volume
        _host
        _device
        _service
        _mac
        _scvm
        _witness
        to_hostname
        instance
        _network
        _to_uuid
        _zone
        name
        metric_name
      }
      point {
        t
        v
      }
    }
    unit
    step
    dropped
  }
}
