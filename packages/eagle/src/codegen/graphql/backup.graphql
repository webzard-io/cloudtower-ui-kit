query getBackupServices($where: BackupServiceWhereInput) {
  backupServices(where: $where) {
    id
    name
    status
    application {
      id
      package {
        id
        version
        architecture
      }
      targetPackage
    }
    backup_clusters {
      id
      name
    }
    backup_plans {
      id
      name
    }
  }
}

query getBackupServiceById($backupServiceId: ID!) {
  backupService(where: { id: $backupServiceId }) {
    id
    name
    status
    backup_clusters {
      id
      name
      vms {
        id
        backup_plans(where: { backup_service: { id: $backupServiceId } }) {
          id
        }
      }
    }
  }
}

query getBackupServiceVlans($where: VlanWhereInput) {
  vlans(where: $where) {
    id
    name
  }
}

query getBackupServiceForOperate($where: BackupServiceWhereUniqueInput!) {
  backupService(where: $where) {
    id
    name
    status
    backup_plans {
      id
      name
      backup_plan_executions {
        id
        backup_target_executions {
          id
          status
        }
      }
      backup_restore_points {
        id
        backup_restore_executions {
          id
          status
        }
      }
    }
  }
}

query getCloudTowerApplicationPackages {
  cloudTowerApplicationPackages(where: { name: "iomesh-backup" }) {
    id
    name
    version
    architecture
  }
}

query getBackupLicense {
  backupLicense {
    license_serial
    software_edition
    type
    sign_date
    expire_date
    unit_num
    used_unit_num
  }
}

query getParseBackupLicense($license: String!) {
  parseBackupLicense(license: $license) {
    license_serial
    software_edition
    type
    sign_date
    expire_date
    unit_num
    used_unit_num
  }
}

mutation updateBackupLicense($license: String!) {
  updateBackupLicense(license: $license) {
    license_serial
    software_edition
    type
    sign_date
    expire_date
    unit_num
    used_unit_num
  }
}

query getBackupOverviewResources($where: BackupServiceWhereInput) {
  backupServices(where: $where) {
    id
    name
    status
    backup_clusters {
      id
      name
    }
    application {
      id
      instanceStatuses
      package {
        id
        version
        architecture
      }
    }
    backup_plans {
      id
      name
      status
      compression
      incremental_time_points {
        hour
        minute
        weekday
        date
        date_position
      }
      incremental_weekdays
      incremental_period
      vms(where: { in_recycle_bin: false }) {
        id
      }
      backup_plan_executions {
        id
        status
        local_created_at
      }
      backup_restore_points(orderBy: local_created_at_DESC) {
        id
        local_created_at
        size
        valid_size
        physical_size
      }
    }
    backup_store_repositories {
      id
      name
      status
    }
    running_vm {
      id
      status
    }
  }
  backupStoreRepositories {
    id
    name
    total_capacity
    used_data_space
    valid_data_space
  }
  cloudTowerApplicationPackages(where: { name: "iomesh-backup" }) {
    id
    version
    architecture
  }
  vmNum: vmsConnection(where: { in_recycle_bin: false }) {
    aggregate {
      count
    }
  }
}

query checkBackupServiceName(
  $where: BackupServiceWhereInput!
  $first: Int = 1
) {
  backupServices(where: $where, first: $first) {
    id
  }
}

mutation createUploadTask($data: UploadTaskCreateInput!) {
  createUploadTask(data: $data) {
    id
    current_chunk
    chunk_size
  }
}

mutation uploadCloudTowerApplicationPackage(
  $data: UploadCloudTowerApplicationPackageInput!
) {
  uploadCloudTowerApplicationPackage(data: $data) {
    id
    status
    current_chunk
    chunk_size
  }
}

mutation deleteBackupImage(
  $where: CloudTowerApplicationPackageWhereUniqueInput!
  $effect: DeleteCloudTowerApplicationPackageEffect
) {
  deleteCloudTowerApplicationPackage(where: $where, effect: $effect) {
    id
  }
}

mutation createBackupService(
  $data: BackupServiceCreateInput!
  $effect: CreateBackupServiceEffect
) {
  createBackupService(data: $data, effect: $effect) {
    id
  }
}

mutation deleteBackupService($where: BackupServiceWhereUniqueInput!) {
  deleteBackupService(where: $where) {
    id
  }
}

mutation updateBackupService(
  $where: BackupServiceWhereUniqueInput!
  $data: BackupServiceUpdateInput!
) {
  updateBackupService(where: $where, data: $data) {
    id
    name
  }
}

query getBackupImageForDelete(
  $where: CloudTowerApplicationPackageWhereUniqueInput!
) {
  cloudTowerApplicationPackage(where: $where) {
    id
    architecture
    version
    applications {
      id
      backup_service {
        id
        name
      }
    }
  }
}

query checkBackupService {
  backupServices {
    id
  }
}

query getBackupServiceClusters($where: ClusterWhereInput!) {
  clusters(where: $where) {
    id
  }
}

query checkBackupAuditLog {
  userAuditLogsConnection(where: { resource_type_contains: "backup" }) {
    aggregate {
      count
    }
  }

  systemAuditLogsConnection(where: { action_contains: "backup" }) {
    aggregate {
      count
    }
  }
}
