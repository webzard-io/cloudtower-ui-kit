query getSvtImages($where: SvtImageWhereInput!, $first: Int) {
  svtImages(where: $where, orderBy: version_DESC, first: $first) {
    id
    path
    name
    size
    version
    cluster {
      name
      id
    }
  }
}

query getSvtImagesCount($where: SvtImageWhereInput!) {
  svtImagesConnection(where: $where) {
    aggregate {
      count
    }
  }
}

query getSvtImageInfo($where: SvtImageWhereUniqueInput!) {
  svtImage(where: $where) {
    id
    path
    name
    size
    version
  }
}

query getClustersBySvtImages($where: SvtImageWhereInput) {
  svtImages(where: $where) {
    id
    cluster {
      id
    }
  }
}

mutation createSvtElfImagesBatch($data: SvtImagesBatchCreateInput!) {
  createSvtElfImagesBatch(data: $data) {
    images {
      id
    }
    upload_task {
      id
      chunk_size
      current_chunk
    }
  }
}

mutation uploadSvtImage($data: UploadSvtImageInput!) {
  uploadSvtImage(data: $data) {
    id
    current_chunk
    status
  }
}

