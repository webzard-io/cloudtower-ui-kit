query getAllRecycleBinSettings {
  clusters {
    id
    name
    hypervisor
    settings {
      id
      vm_recycle_bin {
        enabled
        retain
      }
    }
    vms(where: { in_recycle_bin: true }) {
      id
      name
      original_name
      deleted_at
    }
  }

  globalSettingses(first: 1) {
    id
    vm_recycle_bin {
      enabled
      retain
    }
  }

  clusterSettingses {
    id
    cluster {
      id
      name
    }
    vm_recycle_bin {
      retain
      enabled
    }
  }
}

query globalSettingses {
  globalSettingses(first: 1) {
    id
    vm_recycle_bin {
      enabled
      retain
    }
    auth {
      enable_single_session_login
      login_miss_num_threshold
      login_miss_time_threshold
      password_expire_days
      session_max_age
      access_list
      access_mode
      password_complexity
    }
  }
}

mutation updateRecycleBinGlobalSettings(
  $data: GlobalSettingsUpdateInput!
  $where: GlobalSettingsWhereUniqueInput!
) {
  updateGlobalSettings(where: $where, data: $data) {
    id
    vm_recycle_bin {
      retain
      enabled
    }
  }
}

mutation updateRecycleBinClusterSettings(
  $data: ClusterSettingsUpdateInput!
  $where: ClusterSettingsWhereUniqueInput!
) {
  updateClusterSettings(where: $where, data: $data) {
    id
    vm_recycle_bin {
      retain
      enabled
    }
  }
}

mutation updateAuthGlobalSettings(
  $data: GlobalSettingsUpdateInput!
  $where: GlobalSettingsWhereUniqueInput!
) {
  updateGlobalSettings(data: $data, where: $where) {
    id
    auth {
      enable_single_session_login
      login_miss_num_threshold
      login_miss_time_threshold
      password_expire_days
      session_max_age
      access_list
      access_mode
      password_complexity
    }
  }
}

subscription globalSettings {
  globalSettings {
    mutation
    node {
      id
      vm_recycle_bin {
        enabled
        retain
      }
      auth {
        enable_single_session_login
        login_miss_num_threshold
        login_miss_time_threshold
        password_expire_days
        session_max_age
        access_list
        access_mode
        password_complexity
      }
    }
  }
}
