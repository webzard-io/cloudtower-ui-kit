query iscsiLunInfo($where: IscsiLunWhereUniqueInput!) {
  iscsiLun(where: $where) {
    id
    name
    lun_id
    replica_num
    assigned_size
    unique_size
    shared_size
    allowed_initiators
    thin_provision
    stripe_num
    stripe_size
    iops
    iops_rd
    iops_wr
    bps
    bps_rd
    bps_wr
    iops_max
    iops_max_length
    iops_rd_max
    iops_rd_max_length
    iops_wr_max
    iops_wr_max_length
    bps_max
    bps_max_length
    bps_rd_max
    bps_rd_max_length
    bps_wr_max
    bps_wr_max_length
    zbs_volume_id
    iscsi_target {
      id
      internal
      iqn_whitelist
      cluster {
        id
        name
        type
        connect_state
        disconnected_reason
        disconnected_date
        version
        license_type
        license_expire_date
        nvmf_enabled
        software_edition
        datacenters {
          id
          name
        }
        hosts {
          id
          name
          data_ip
        }
        settings {
          id
          enabled_iscsi
        }
      }
    }
    consistency_group {
      id
      name
    }
  }
}

