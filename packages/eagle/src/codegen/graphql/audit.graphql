query userAuditLogInfo($where: UserAuditLogWhereUniqueInput!) {
  userAuditLog(where: $where) {
    id
    action
    status
    user {
      id
      username
    }
    ip_address
    cluster {
      id
      name
    }
    message
    createdAt
    started_at
    finished_at
    username
  }
}

query systemAuditLogInfo($where: SystemAuditLogWhereUniqueInput!) {
  systemAuditLog(where: $where) {
    id
    action
    status

    cluster {
      id
      name
    }
    message
    local_created_at
    finished_at
  }
}

mutation createUserAuditLog($data: UserAuditLogCreateInput!) {
  createUserAuditLog(data: $data) {
    id
    action
    status
    user {
      id
      username
    }
    ip_address
    cluster {
      id
      name
    }
    message
    createdAt
    started_at
    finished_at
  }
}
