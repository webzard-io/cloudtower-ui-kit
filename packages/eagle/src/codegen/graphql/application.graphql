mutation updateApplication(
  $data: ApplicationUpdateInput!
  $where: ApplicationWhereUniqueInput!
  $effect: UpdateApplicationEffectInput
) {
  updateApplication(data: $data, where: $where, effect: $effect) {
    id
  }
}

query getApplication($id: ID!) {
  application(where: { id: $id }) {
    id
    vcpu
    volume_size
    storage_ip
    cluster {
      id
      name
      iscsi_vip
      management_vip
      hosts {
        id
        data_ip
        access_ip
        management_ip
        vmotion_ip
        nics(where: { type: STORAGE }) {
          id
          type
          subnet_mask
        }
      }
    }
    memory
  }
}

query getApplicationsState($where: ApplicationWhereInput) {
  applications(where: $where) {
    id
    state
    cluster {
      id
      name
    }
  }
}

mutation deployMonitorApplicationBatch(
  $data: [DeployMonitorApplicationBatchInput!]!
) {
  deployMonitorApplicationBatch(data: $data) {
    id
    chunk_size
    current_chunk
  }
}

mutation upgradeMonitorApplicationBatch(
  $data: UpgradeMonitorApplicationBatchInput!
) {
  UpgradeMonitorApplicationBatch(data: $data) {
    id
    chunk_size
    current_chunk
  }
}

mutation uploadMonitorApplication($data: UploadMonitorApplicationInput!) {
  uploadMonitorApplication(data: $data) {
    id
    current_chunk
    status
  }
}
