query GetUserRoleNexts {
  userRoleNexts {
    id
    name
    actions
    users {
      id
      name
    }
    preset
  }
}

query GetUserRoleNext($where: UserRoleNextWhereUniqueInput!) {
  userRoleNext(where: $where) {
    id
    name
    actions
    users {
      id
      name
      internal
    }
    preset
  }
}

mutation CreateUserRoleNext($data: UserRoleNextCreateInput!) {
  createUserRoleNext(data: $data) {
    id
    name
  }
}

mutation UpdateUserRoleNext($id: ID, $data: UserRoleNextUpdateInput!) {
  updateUserRoleNext(where: { id: $id }, data: $data) {
    id
    name
  }
}

mutation DeleteUserRoleNext($id: ID) {
  deleteUserRoleNext(where: { id: $id }) {
    id
    name
  }
}
