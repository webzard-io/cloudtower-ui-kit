query getCreateVmSource(
  $id: ID
  $clone_vm: Boolean!
  $rebuild_from_snapshot: Boolean!
  $created_from_template: Boolean!
) {
  vm(where: { id: $id }) @include(if: $clone_vm) {
    id
    name
    ha
    vcpu
    description
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    cpu {
      cores
      sockets
    }
    cpu_exclusive_expected_enabled
    memory
    firmware
    vm_disks {
      id
      key
      boot
      type
      bus
      disabled
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      svt_image {
        id
        name
        path
        size
      }
      elf_image {
        id
        name
        path
        size
        content_library_image {
          id
          name
        }
      }
      vm_volume {
        id
        name
        path
        size
        sharing
        elf_storage_policy
        type
      }
    }
    vm_nics(orderBy: order_ASC) {
      id
      vlan {
        id
        name
      }
      mac_address
      enabled
      nic {
        id
        local_id
        is_sriov
        total_vf_num
        used_vf_num
      }
      model
      mirror
      ingress_rate_limit_burst_in_bit
      ingress_rate_limit_enabled
      ingress_rate_limit_max_rate_in_bitps
      egress_rate_limit_burst_in_bit
      egress_rate_limit_enabled
      egress_rate_limit_max_rate_in_bitps
    }
    host {
      id
      name
    }
    cluster {
      id
      name
      vhost_enabled
      version
      type
      stretch
    }
    folder {
      id
      name
    }
    usb_devices {
      id
    }
  }
  vmSnapshot(where: { id: $id }) @include(if: $rebuild_from_snapshot) {
    id
    name
    ha
    vcpu
    description
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    cpu {
      cores
      sockets
    }
    memory
    firmware
    cluster {
      id
      name
      vhost_enabled
      version
      type
      local_id
      stretch
    }
    vm_disks {
      key
      boot
      type
      bus
      path
      size
      disk_name
      disabled
      elf_image_local_id
      vm_volume_local_id
      svt_image_local_id
      index
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      storage_policy_uuid
    }
    vm_nics {
      index
      mac_address
      enabled
      model
      mirror
      vlan {
        vlan_local_id
        vlan_id
      }
      ingress_rate_limit_burst_in_bit
      ingress_rate_limit_enabled
      ingress_rate_limit_max_rate_in_bitps
      egress_rate_limit_burst_in_bit
      egress_rate_limit_enabled
      egress_rate_limit_max_rate_in_bitps
    }
  }
  vmTemplate(where: { id: $id }) @include(if: $created_from_template) {
    id
    name
    ha
    vcpu
    description
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    cpu {
      cores
      sockets
    }
    memory
    firmware
    cluster {
      id
      name
      vhost_enabled
    }
    vm_disks {
      key
      boot
      type
      bus
      path
      size
      disk_name
      disabled
      elf_image_local_id
      vm_volume_local_id
      svt_image_local_id
      index
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      storage_policy_uuid
    }
    vm_nics {
      index
      mac_address
      enabled
      model
      mirror
      vlan {
        vlan_local_id
        vlan_id
      }
      ingress_rate_limit_burst_in_bit
      ingress_rate_limit_enabled
      ingress_rate_limit_max_rate_in_bitps
      egress_rate_limit_burst_in_bit
      egress_rate_limit_enabled
      egress_rate_limit_max_rate_in_bitps
    }
    cloud_init_supported
  }
  contentLibraryVmTemplate(where: { id: $id })
    @include(if: $created_from_template) {
    id
    name
    template_config {
      cpu_exclusive_expected_enabled
    }
    clusters {
      id
      name
      architecture
      version
      type
      stretch
      connect_state
    }
    vm_templates {
      id
      name
      ha
      vcpu
      description
      io_policy
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      cpu {
        cores
        sockets
      }
      memory
      firmware
      cluster {
        id
        local_id
        name
        vhost_enabled
        stretch
        type
        version
      }
      vm_disks {
        key
        boot
        type
        bus
        path
        size
        disk_name
        disabled
        elf_image_local_id
        vm_volume_local_id
        svt_image_local_id
        index
        max_iops
        max_iops_policy
        max_bandwidth
        max_bandwidth_policy
        storage_policy_uuid
      }
      vm_nics {
        index
        mac_address
        enabled
        model
        mirror
        vlan {
          vlan_local_id
          vlan_id
        }
        ingress_rate_limit_burst_in_bit
        ingress_rate_limit_enabled
        ingress_rate_limit_max_rate_in_bitps
        egress_rate_limit_burst_in_bit
        egress_rate_limit_enabled
        egress_rate_limit_max_rate_in_bitps
      }
      cloud_init_supported
    }
  }
}

