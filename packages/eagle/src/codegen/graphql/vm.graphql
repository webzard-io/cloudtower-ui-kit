mutation createVm($data: VmCreateInput!, $effect: CreateVmEffect!) {
  createVm(data: $data, effect: $effect) {
    id
    name
  }
}

mutation updateVm(
  $data: VmUpdateInput!
  $effect: UpdateVmEffect
  $where: VmWhereUniqueInput!
) {
  updateVm(data: $data, effect: $effect, where: $where) {
    id
    name
    status
    entityAsyncStatus
    hostname
    dns_servers
    ips
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    vm_disks {
      id
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
    }
    vm_nics {
      id
      vlan {
        id
        name
      }
      ip_address
      mac_address
      enabled
      model
    }
    folder {
      id
      name
    }
    sync_vm_time_on_resume
  }
}

query getVmForEdit($where: VmWhereUniqueInput!) {
  vm(where: $where) {
    id
    name
    description
    vcpu
    cpu {
      cores
      sockets
    }
    cpu_exclusive_expected_enabled
    cpu_exclusive_status
    memory
    ha
    status
    nested_virtualization
    host {
      id
      allocatable_memory_bytes
      nested_virtualization
      allocable_cpu_cores_for_vm_exclusive
      iommu
    }
    cluster {
      id
      type
      architecture
      version
      hypervisor
      hosts {
        id
        allocatable_memory_bytes
        allocable_cpu_cores_for_vm_exclusive
      }
    }
    sriov_vm_nics: vm_nics(where: { model: SRIOV }) {
      id
      model
    }
    guest_os_type
    os
    clock_offset
    win_opt
    gpu_devices {
      id
      name
    }
  }
}

