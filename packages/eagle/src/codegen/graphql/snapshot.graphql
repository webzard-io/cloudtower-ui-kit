query getVmSnapshotAndVm(
  $where: VmSnapshotWhereUniqueInput!
  $vmWhere: VmWhereUniqueInput!
) {
  vmSnapshot(where: $where) {
    id
    name
    local_created_at
    vm_disks {
      index
      key
      disk_name
      image_name
      type
      size
      bus
      disabled
      elf_image_local_id
      svt_image_local_id
      vm_volume_local_id
    }
  }
  vm(where: $vmWhere) {
    id
    name
    status
    entityAsyncStatus
    nested_virtualization
    folder {
      id
      name
    }
    vm_disks {
      id
      key
      type
      bus
      disabled
      vm_volume {
        id
        local_id
        name
        size
      }
      elf_image {
        id
        local_id
        name
      }
      svt_image {
        id
        local_id
        name
      }
    }
    cluster {
      id
      version
      type
      architecture
    }
    svt_iso
  }
}

query getVmSnapshot($where: VmSnapshotWhereUniqueInput!) {
  vmSnapshot(where: $where) {
    id
    local_id
    name
    consistent_type
    vcpu
    memory
    local_created_at
    ha
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    vm {
      id
      local_id
      name
    }
    cluster {
      id
      version
      type
      architecture
    }
    vm_disks {
      index
      type
      disk_name
      image_name
      bus
      size
      elf_image_local_id
      svt_image_local_id
      disabled
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
    }
    vm_nics {
      index
      ip_address
      mac_address
      vlan {
        vlan_id
        vlan_local_id
        name
      }
      ingress_rate_limit_burst_in_bit
      ingress_rate_limit_enabled
      ingress_rate_limit_max_rate_in_bitps
      egress_rate_limit_burst_in_bit
      egress_rate_limit_enabled
      egress_rate_limit_max_rate_in_bitps
    }
  }
}

query getSnapshotForCreateVm($where: VmSnapshotWhereUniqueInput!) {
  vmSnapshot(where: $where) {
    id
    name
    cluster {
      id
      name
    }
    size
    vcpu
    cpu {
      cores
      sockets
    }
    memory
    ha
    clock_offset
    cpu_model
    win_opt
    firmware
  }
}

mutation createVmSnapshot($data: VmSnapshotCreateInput!) {
  createVmSnapshot(data: $data) {
    id
  }
}

mutation updateVmSnapshot(
  $data: VmSnapshotUpdateInput!
  $where: VmSnapshotWhereUniqueInput!
) {
  updateVmSnapshot(data: $data, where: $where) {
    id
    name
  }
}

mutation deleteVmSnapshot($where: VmSnapshotWhereUniqueInput!) {
  deleteVmSnapshot(where: $where) {
    id
  }
}

query getMountedVolumes($where: VmVolumeWhereInput) {
  vmVolumes(where: $where) {
    id
    local_id
    name
    mounting
  }
}

query getVmSnapshotImages(
  $elfImageLocalIds: [String!]
  $svtImageLocalIds: [String!]
) {
  elfImages(where: { local_id_in: $elfImageLocalIds }) {
    id
    local_id
    name
  }
  svtImages(where: { local_id_in: $svtImageLocalIds }) {
    id
    local_id
    name
  }
}
