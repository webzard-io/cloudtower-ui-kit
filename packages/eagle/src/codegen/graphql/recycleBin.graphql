    status
    description
    local_created_at
    in_recycle_bin
    deleted_at
    io_policy
    max_iops
    max_iops_policy
    max_bandwidth
    max_bandwidth_policy
    internal
    host {
      id
      name
      management_ip
      nested_virtualization
    }
    cluster {
      id
      local_id
      name
      version
      connect_state
      disconnected_reason
      disconnected_date
      datacenters {
        name
        id
      }
      type
      settings {
        id
        vm_recycle_bin {
          enabled
          retain
        }
      }
    }
    vcpu
    cpu {
      cores
      sockets
    }
    cpu_usage
    memory
    memory_usage
    ha
    firmware
    nested_virtualization
    cpu_model
    clock_offset
    win_opt
    video_type
    vm_disks {
      id
      boot
      type
      bus
      device
      disabled
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      elf_image {
        id
        name
        path
        size
      }
      svt_image {
        id
        name
        path
        size
      }
      vm_volume {
        id
        local_id
        name
        path
        size
        sharing
        unique_size
        guest_used_size
        guest_size_usage
      }
      unsafe_image_path
      unsafe_image_uuid
      unsafe_provision
    }
    vm_nics {
      id
      local_id
      vlan {
        id
        name
      }
      ip_address
      mac_address
      enabled
      model
      order
    }
    os
    hostname
    dns_servers
    vm_tools_version
    vm_tools_status
    ips
    kernel_info
    folder {
      id
      name
    }
    provisioned_size
    unique_size
    protected
    vm_usage
    backup_plans {
      id
      name
    }
  }
  globalSettingses(first: 1) {
    id
    vm_recycle_bin {
      enabled
      retain
    }
  }
}

query GetSameNameVms($where: VmWhereInput) {
  vms(where: $where) {
    id
    name
    cluster {
      id
    }
  }
}

mutation RecoverVmInRecycleBin($id: ID) {
  updateVm(where: { id: $id }, data: { in_recycle_bin: false }) {
    id
    name
  }
}

mutation RecoverVmInRecycleBinWithName($id: ID, $name: String) {
  updateVm(where: { id: $id }, data: { in_recycle_bin: false, name: $name }) {
    id
    name
  }
}

mutation DeleteVmInRecycleBin($id: ID, $effect: DeleteVmEffect!) {
  deleteVm(where: { id: $id }, effect: $effect) {
    id
    name
  }
}
query getRecycleBinGlobalSettings {
  globalSettingses(first: 1) {
    id
    vm_recycle_bin {
      enabled
      retain
    }
  }
}
