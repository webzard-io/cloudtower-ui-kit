mutation createRecycleBinClusterSettings($data: ClusterSettingsCreateInput!) {
  createClusterSettings(data: $data) {
    id
  }
}

query GetVmsInRecycleBin(
  $where: ClusterWhereInput
  $zoneWhere: ZoneWhereInput
  $includeZone: Boolean!
) {
  clusters(where: $where) {
    id
    settings {
      id
      vm_recycle_bin {
        enabled
        retain
      }
    }
    vms(where: { in_recycle_bin: true }) {
      id
      name
      size
      original_name
      deleted_at
    }
  }
  globalSettingses(first: 1) {
    id
    vm_recycle_bin {
      enabled
      retain
    }
  }
  zones(where: $zoneWhere) @include(if: $includeZone) {
    id
    hosts {
      id
      cluster {
        id
        settings {
          id
          vm_recycle_bin {
            enabled
            retain
          }
        }
      }
      vms(where: { in_recycle_bin: true }) {
        id
        name
        size
        original_name
        deleted_at
      }
    }
  }
}

query GetRecycleBinSettings($where: ClusterWhereInput) {
  clusters(where: $where) {
    id
    settings {
      id
      vm_recycle_bin {
        enabled
        retain
      }
    }
  }
  globalSettingses(first: 1) {
    id
    vm_recycle_bin {
      enabled
      retain
    }
  }
}

query GetVmInRecycleBinDetail($where: VmWhereUniqueInput!) {
