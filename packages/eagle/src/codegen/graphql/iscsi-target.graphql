query checkIscsiTargetByName($name: String!, $clusterId: ID!) {
  iscsiTargets(where: { name: $name, cluster: { id: $clusterId } }, first: 1) {
    id
  }
  nvmfSubsystems(
    where: { name: $name, cluster: { id: $clusterId } }
    first: 1
  ) {
    id
  }

  nfsExports(where: { name: $name, cluster: { id: $clusterId } }, first: 1) {
    id
  }
}

mutation createIscsiTarget($data: IscsiTargetCreateInput!) {
  createIscsiTarget(data: $data) {
    id
    iqn_whitelist
    replica_num
  }
}

mutation updateIscsiTarget(
  $data: IscsiTargetUpdateInput!
  $where: IscsiTargetWhereUniqueInput!
) {
  updateIscsiTarget(data: $data, where: $where) {
    id
    name
    ip_whitelist
    iqn_whitelist
  }
}

mutation deleteIscsiTarget($where: IscsiTargetWhereUniqueInput!) {
  deleteIscsiTarget(where: $where) {
    id
  }
}

query clusterVersion($id: ID!) {
  cluster(where: { id: $id }) {
    id
    version
    type
    hosts {
      id
    }
    stretch
  }
}

query iscsiTargetsFromConsistencyGroup($where: IscsiTargetWhereInput) {
  iscsiTargets(where: $where, orderBy: name_ASC) {
    id
    name
    internal
    luns(orderBy: name_ASC) {
      id
      name
      consistency_group {
        id
        name
      }
    }
  }
}

query checkIscsiTargetNum($where: IscsiTargetWhereInput!) {
  iscsiTargets(where: $where) {
    id
  }
}
