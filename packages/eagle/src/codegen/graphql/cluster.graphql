query getClusterResources($id: ID) {
  entityFilters(
    where: {
      OR: [{ clusters_every: { id: null } }, { clusters_some: { id: $id } }]
    }
  ) {
    id
    name
    preset
    clusters {
      id
    }
  }
  vms(where: { cluster: { id: $id } }) {
    id
    name
    original_name
    in_recycle_bin
    backup_plans {
      id
      name
    }
  }
  deployedMonitorApplications: applications(
    where: { cluster: { id: $id }, state: DEPLOYED, type: MONITOR }
    first: 1
  ) {
    id
  }
  cluster(where: { id: $id }) {
    id
    connect_state
    disconnected_reason
    disconnected_date
  }

  contentLibraryImages(
    where: { clusters_some: { id: $id } }
    orderBy: name_ASC
  ) {
    id
    name
    clusters {
      id
    }
  }

  contentLibraryVmTemplates(
    where: { clusters_some: { id: $id } }
    orderBy: name_ASC
  ) {
    id
    name
    clusters {
      id
    }
  }
}

