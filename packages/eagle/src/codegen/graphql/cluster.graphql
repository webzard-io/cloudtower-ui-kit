query getClusterId(
  $iscsiTargetId: ID
  $hostId: ID
  $zoneId: ID
  $skipIscsiTarget: Boolean!
  $skipHost: Boolean!
  $skipZone: Boolean!
) {
  iscsiTarget(where: { id: $iscsiTargetId }) @skip(if: $skipIscsiTarget) {
    id
    cluster {
      id
    }
  }
  host(where: { id: $hostId }) @skip(if: $skipHost) {
    id
    cluster {
      id
    }
  }
  zone(where: { id: $zoneId }) @skip(if: $skipZone) {
    id
    cluster {
      id
    }
  }
}

