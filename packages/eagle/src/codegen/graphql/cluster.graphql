query clusterConnector($input: ClusterConnectorInput!) {
  clusterConnector(input: $input) {
    hypervisor
    name
    version
    uuid
    type
    architecture
    software_edition
    license_type
    stretch
    host_uuids
    zones {
      id
      host_uuids
    }
  }
  deploys(first: 1) {
    id
    license {
      id
      max_chunk_num
      type
      software_edition
    }
  }
  hostsConnection {
    aggregate {
      count
    }
  }
}

