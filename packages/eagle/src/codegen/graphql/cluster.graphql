query getPingMetrics($clusterId: ID!) {
  cluster(where: { id: $clusterId }) {
    id
    name
    hypervisor
    zones {
      id
      is_preferred
      hosts {
        id
        local_id
        name
      }
    }
    witness {
      id
      local_id
      name
    }
    metro_availability_checklist {
      primaryZoneAndWitness {
        items {
          key
          status
        }
      }
      secondaryZoneAndWitness {
        items {
          key
          status
        }
      }
      zoneAndZone {
        items {
          key
          status
        }
      }
    }
  }
  hostsPingTime: metrics(
    input: {
      cluster: { id: $clusterId }
      metric: "host_network_ping_time_ns"
      labels: { network: STORAGE }
    }
  ) {
    unit
    samples {
      labels {
        _host
        _network
        _to_uuid
      }
      point {
        t
        v
      }
    }
  }
  hostsPingPacketLoss: metrics(
    input: {
      cluster: { id: $clusterId }
      metric: "host_network_ping_packet_loss_percent"
      labels: { network: STORAGE }
    }
  ) {
    unit
    samples {
      labels {
        _host
        _network
        _to_uuid
      }
      point {
        t
        v
      }
    }
  }
  witnessPingTime: metrics(
    input: {
      cluster: { id: $clusterId }
      metric: "witness_network_ping_time_ns"
      labels: { network: STORAGE }
    }
  ) {
    unit
    samples {
      labels {
        _witness
        _network
        _to_uuid
      }
      point {
        t
        v
      }
    }
  }
  witnessPingPacketLoss: metrics(
    input: {
      cluster: { id: $clusterId }
      metric: "witness_network_ping_packet_loss_percent"
      labels: { network: STORAGE }
    }
  ) {
    unit
    samples {
      labels {
        _witness
        _network
        _to_uuid
      }
      point {
        t
        v
      }
    }
  }
  scvmPingTime: metrics(
    input: {
      cluster: { id: $clusterId }
      metric: "scvm_network_ping_time_ns"
      labels: { network: STORAGE }
    }
  ) {
    unit
    samples {
      labels {
        _scvm
        _network
        _to_uuid
      }
      point {
        t
        v
      }
    }
  }
  scvmPingPacketLoss: metrics(
    input: {
      cluster: { id: $clusterId }
      metric: "scvm_network_ping_packet_loss_percent"
      labels: { network: STORAGE }
    }
  ) {
    unit
    samples {
      labels {
        _scvm
        _network
        _to_uuid
      }
      point {
        t
        v
      }
    }
  }
}

