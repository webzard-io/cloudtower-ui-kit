query deployedLicense {
  deploys(first: 1) {
    id
    license {
      id
      license_serial
      maintenance_end_date
      maintenance_start_date
      max_chunk_num
      max_cluster_num
      sign_date
      expire_date
      software_edition
      type
    }
  }
}

mutation parseLicense($license: String!) {
  parseLicense(license: $license) {
    id
    license_serial
    maintenance_end_date
    maintenance_start_date
    max_chunk_num
    max_cluster_num
    sign_date
    expire_date
    software_edition
    type
  }
}

mutation updateDeploy(
  $data: DeployUpdateInput!
  $effect: UpdateDeployEffect
  $where: DeployWhereUniqueInput!
) {
  updateDeploy(data: $data, effect: $effect, where: $where) {
    id
    license {
      id
      license_serial
      maintenance_end_date
      maintenance_start_date
      max_chunk_num
      max_cluster_num
      sign_date
      expire_date
      software_edition
      type
    }
  }
}
