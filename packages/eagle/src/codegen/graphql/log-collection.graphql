mutation createLogCollection($data: LogCollectionCreateInput!) {
  createLogCollection(data: $data) {
    id
    progress
    size
    started_at
    log_started_at
    log_ended_at
    path
    owner
    status
    hosts {
      id
      name
    }
    cluster {
      id
      name
    }
  }
}

mutation updateLogCollection(
  $data: LogCollectionUpdateInput!
  $where: LogCollectionWhereUniqueInput!
) {
  updateLogCollection(data: $data, where: $where) {
    id
    progress
    size
    started_at
    log_started_at
    log_ended_at
    path
    owner
    status
    hosts {
      id
      name
    }
    cluster {
      id
      name
    }
  }
}

mutation deleteLogCollection($where: LogCollectionWhereUniqueInput!) {
  deleteLogCollection(where: $where) {
    id
  }
}

query getLogServiceConfigs($id: ID!) {
  logServiceConfigs(input: { cluster: { id: $id } }) {
    group_name
    service_list
  }
}

query logCollectionPrecheck($where: LogCollectionPrecheckInput!) {
  logCollectionPrecheck(where: $where) {
    canCreateLogCollection
  }
}

mutation abortLogCollection($task_id: String!) {
  abortLogCollection(task_id: $task_id) {
    id
  }
}
