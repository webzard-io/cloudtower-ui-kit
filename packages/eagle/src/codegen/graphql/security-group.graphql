query securityGroupInfo($id: ID!) {
  securityGroup(where: { id: $id }) {
    id
    name
    description
    everoute_cluster {
      id
      name
      phase
      status {
        conditions {
          type
          lastProbeTime
        }
        controllers {
          instances {
            isHealth
            metrics {
              cpuUsage
              memoryUsage
              dataVolumeUsage
            }
            vm {
              id
              name
              host {
                id
                name
              }
              cluster {
                id
                name
                architecture
              }
              vm_nics {
                id
                vlan {
                  id
                  name
                }
              }
            }
          }
        }
        agents {
          instances {
            hostID
            isHealth
            phase
            host {
              id
              name
              cluster {
                id
                name
              }
            }
          }
          manageVDSes {
            vds {
              id
              name
              cluster {
                id
                name
                connect_state
                disconnected_date
              }
            }
            phase
          }
        }
      }
    }
    label_groups {
      label_ids
      labels {
        id
        key
        value
        vms {
          id
          name
          vm_usage
          in_recycle_bin
          cluster {
            id
            name
            everoute_cluster {
              id
              name
            }
          }
          vm_nics {
            id
            vlan {
              id
              name
              vds {
                id
                name
                everoute_cluster {
                  id
                  name
                }
              }
            }
          }
          labels {
            id
            key
            value
          }
        }
      }
    }
    vms(where: { in_recycle_bin: false }) {
      id
      name
      vm_usage
      in_recycle_bin
      cluster {
        id
        name
        everoute_cluster {
          id
          name
        }
      }
      vm_nics {
        id
        vlan {
          id
          name
          vds {
            id
            name
            everoute_cluster {
              id
              name
            }
          }
        }
      }
      labels {
        id
        key
        value
      }
    }
    security_policies {
      id
      name
      apply_to {
        security_group_id
      }
      ingress {
        security_group_id
      }
      egress {
        security_group_id
      }
    }
    isolation_policies {
      id
      vm {
        id
        name
        cluster {
          id
        }
      }
      ingress {
        security_group_id
      }
      egress {
        security_group_id
      }
    }
  }
}

