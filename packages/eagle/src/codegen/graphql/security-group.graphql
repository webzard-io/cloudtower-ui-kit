mutation updateSecurityGroup(
  $data: SecurityGroupUpdateInput!
  $where: SecurityGroupWhereUniqueInput!
) {
  updateSecurityGroup(data: $data, where: $where) {
    id
  }
}

mutation deleteSecurityGroup($where: SecurityGroupWhereUniqueInput!) {
  deleteSecurityGroup(where: $where) {
    id
  }
}

mutation deleteManySecurityGroups($where: SecurityGroupWhereInput) {
  deleteManySecurityGroups(where: $where) {
    count
  }
}

query checkNameOfSecurityGroupExists($name: String, $id: ID) {
  securityGroups(where: { name: $name, id_not: $id }) {
    id
  }
}

query getAllNamesOfSecurityGroups($where: SecurityGroupWhereInput) {
  securityGroups(where: $where) {
    id
    name
  }
}

