query clusterSettings($where: ClusterWhereUniqueInput!) {
  cluster(where: $where) {
    id
    name
    settings {
      id
      default_ha
      enabled_iscsi
      default_storage_policy
    }
  }
}

mutation createClusterSettings($data: ClusterSettingsCreateInput!) {
  createClusterSettings(data: $data) {
    id
    default_ha
    enabled_iscsi
    default_storage_policy
    cluster {
      id
    }
  }
}

mutation updateClusterSettings(
  $data: ClusterSettingsUpdateInput!
  $where: ClusterSettingsWhereUniqueInput!
) {
  updateClusterSettings(where: $where, data: $data) {
    id
    default_ha
    enabled_iscsi
    default_storage_policy
  }
}

query getAccessVds($where: VdsWhereInput!) {
  vdses(where: $where) {
    id
  }
}

query clusterForStoragePolicy($id: ID!) {
  cluster(where: { id: $id }) {
    id
    name
    stretch
    settings {
      id
      default_storage_policy
    }
  }
  vmVolumes(where: { cluster: { id: $id } }) {
    id
    name
    elf_storage_policy
    type
  }
}

query getAscensionReplicaResource(
  $clusterId: ID
  $targetId: ID
  $nfsId: ID
  $subsystemId: ID
  $skipCluster: Boolean!
  $skipTarget: Boolean!
  $skipNfs: Boolean!
  $skipSubsystem: Boolean!
) {
  cluster(where: { id: $clusterId }) @skip(if: $skipCluster) {
    id
    name
    total_data_capacity
    used_data_space
    failure_data_space
  }
  vmVolumes(where: { cluster: { id: $clusterId } }) @skip(if: $skipCluster) {
    id
    name
    elf_storage_policy
    type
    size
    unique_size
    shared_size
  }
  nfsExport(where: { id: $nfsId }) @skip(if: $skipNfs) {
    id
    name
    cluster {
      id
      total_data_capacity
      used_data_space
      failure_data_space
    }
    inodes {
      id
      replica_num
      assigned_size
      unique_size
      shared_size
    }
  }
  iscsiTarget(where: { id: $targetId }) @skip(if: $skipTarget) {
    id
    name
    cluster {
      id
      total_data_capacity
      used_data_space
      failure_data_space
    }
    luns {
      id
      replica_num
      thin_provision
      assigned_size
      unique_size
      shared_size
    }
  }
  nvmfSubsystem(where: { id: $subsystemId }) @skip(if: $skipSubsystem) {
    id
    name
    cluster {
      id
      total_data_capacity
      used_data_space
      failure_data_space
    }
    namespaces {
      id
      replica_num
      thin_provision
      assigned_size
      unique_size
      shared_size
    }
  }
}
