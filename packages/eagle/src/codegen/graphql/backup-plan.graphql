query backupPlanDetail($id: ID!) {
  backupPlan(where: { id: $id }) {
    id
    name
    status
    description
    entityAsyncStatus
    backup_service {
      id
      name
      status
    }
    backup_store_repository {
      id
      name
    }
    compression
    incremental_period
    incremental_time_points {
      hour
      minute
      weekday
      date
      date_position
    }
    incremental_weekdays
    full_period
    full_interval
    full_time_point {
      hour
      minute
      weekday
      date
      date_position
    }
    keep_policy
    keep_policy_value
    next_execute_time
    enable_window
    window_start
    window_end
    last_executed_at
    last_execute_status
    last_execute_total_job_count
    last_execute_success_job_count
    last_manual_executed_at
    last_manual_execute_status
    last_manual_execute_total_job_count
    last_manual_execute_success_job_count
    backup_plan_executions {
      id
      status
      local_created_at
      backup_target_executions {
        id
        status
      }
    }
    vms(where: { in_recycle_bin: false }) {
      id
      local_id
      name
      cluster {
        id
        name
      }
    }
    backup_restore_points(orderBy: local_created_at_DESC) {
      id
      vm_name
      vm_local_id
      cluster_local_id
      vm {
        id
        in_recycle_bin
        name
        original_name
        cluster {
          id
          name
          local_id
        }
      }
    }
  }
  clusters {
    id
    local_id
  }
}

query backupTargetExecutions($where: BackupTargetExecutionWhereInput!) {
  backupTargetExecutions(where: $where) {
    id
    local_id
    status
    executed_at
    duration
    vm {
      id
      name
    }
  }
}

mutation updateBackupPlan(
  $data: BackupPlanUpdateInput!
  $where: BackupPlanWhereUniqueInput!
) {
  updateBackupPlan(data: $data, where: $where) {
    id
    entityAsyncStatus
    status
  }
}

mutation deleteBackupPlan($where: BackupPlanWhereUniqueInput!) {
  deleteBackupPlan(where: $where) {
    id
  }
}

query checkBackupPlanName($where: BackupPlanWhereInput!, $first: Int = 1) {
  backupPlans(where: $where, first: $first) {
    id
  }
}

query backupPlanForUpdateObject($id: ID!) {
  backupPlan(where: { id: $id }) {
    id
    name
    description
    backup_service {
      id
      name
      backup_clusters {
        id
        name
      }
    }
    backup_store_repository {
      id
      name
    }
    compression
    vms(where: { in_recycle_bin: false }) {
      id
      name
    }
    backup_plan_executions {
      id
      backup_target_executions {
        id
        status
      }
    }
    backup_restore_points {
      id
      backup_restore_executions {
        id
        status
      }
    }
  }
}

query backupPlanForUpdatePeriod($id: ID!) {
  backupPlan(where: { id: $id }) {
    id
    name
    incremental_period
    incremental_time_points {
      hour
      minute
      weekday
      date
      date_position
    }
    incremental_weekdays
    full_period
    full_interval
    full_time_point {
      hour
      minute
      weekday
      date
      date_position
    }
    enable_window
    window_start
    window_end
    backup_delay_option
  }
}

query backupPlanForUpdatePolicy($id: ID!) {
  backupPlan(where: { id: $id }) {
    id
    name
    keep_policy
    keep_policy_value
  }
}

mutation createBackupPlan($data: BackupPlanCreateInput!) {
  createBackupPlan(data: $data) {
    id
    entityAsyncStatus
  }
}

query backupRestorePointForRestoreVm(
  $where: BackupRestorePointWhereUniqueInput!
) {
  backupRestorePoint(where: $where) {
    id
    local_created_at
    vm_name
    vm_local_id
    cluster_local_id
    vm {
      id
      name
      original_name
      in_recycle_bin
      status
      cluster {
        id
        name
        local_id
      }
      vm_disks {
        id
        type
        vm_volume {
          id
          size
          lun {
            id
            zbs_volume_id
          }
        }
      }
    }
  }
  backupRestorePointMetadata(where: $where) {
    name
    cluster_architecture
    cluster_vhost_enabled
    cluster_type
    cluster_version
    cluster_local_id
    io_policy
    vm_nics {
      enabled
      mirror
      vlan_local_id
      vlan_name
    }
    vm_disks {
      disabled
      type
      vm_volume_size
      vm_volume_lun_zbs_volume_id
      vm_volume_elf_storage_policy
    }
  }
}

query getClusterForRestoreVm($cluster_local_id: String!) {
  cluster(where: { local_id: $cluster_local_id }) {
    id
    name
    architecture
  }
}

mutation restoreVm($data: BackupRestoreExecutionCreateInput!) {
  createBackupRestoreExecution(data: $data) {
    id
  }
}

mutation createBackupPlanExecution($data: BackupPlanExecutionCreateInput!) {
  createBackupPlanExecution(data: $data) {
    id
    entityAsyncStatus
  }
}

query backupRestorePointForDelete($where: BackupRestorePointWhereUniqueInput!) {
  backupRestorePoint(where: $where) {
    id
    local_created_at
    slice
    backup_plan {
      id
      backup_plan_executions {
        id
        backup_target_executions {
          id
          status
          parent_backup
        }
      }
    }
  }
}

query backupRestorePointsForDelete($where: BackupRestorePointWhereInput!) {
  backupRestorePoints(where: $where, orderBy: local_created_at_ASC) {
    id
    local_created_at
    local_id
    type
    backup_restore_executions {
      id
      status
    }
  }
}

mutation updateBackupRestorePoint(
  $where: BackupRestorePointWhereUniqueInput!
  $data: BackupRestorePointUpdateInput!
) {
  updateBackupRestorePoint(where: $where, data: $data) {
    id
    entityAsyncStatus
  }
}

query backupPlanForManualExec($id: ID!) {
  backupPlan(where: { id: $id }) {
    id
    vms {
      id
    }
    backup_restore_points(where: { creation: MANUAL }) {
      id
      vm {
        id
      }
    }
  }
  backupTargetExecutions(
    where: {
      status_in: [INITIALIZING, RUNNING, PENDING, PAUSED]
      backup_plan_execution: { method: MANUAL, backup_plan: { id: $id } }
    }
  ) {
    id
  }
}

query backupPlanForDelete($id: ID!) {
  backupPlan(where: { id: $id }) {
    id
    backup_plan_executions {
      id
      backup_target_executions {
        id
        status
      }
    }
    backup_restore_points {
      id
      backup_restore_executions {
        id
        status
      }
    }
  }
}

query checkBackupRepoAndService {
  backupStoreRepositories {
    id
  }
  backupServices {
    id
    backup_clusters {
      id
    }
  }
  backupPlansConnection {
    aggregate {
      count
    }
  }
}

query geVmsAndLicenseForCreate {
  vms(where: { backup_plans_some: { id_not: null }, in_recycle_bin: false }) {
    id
  }
  backupLicense {
    unit_num
    used_unit_num
  }
}
