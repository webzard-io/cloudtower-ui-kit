query getDiskInfo($id: ID!) {
  disk(where: { id: $id }) {
    id
    name
    model
    usage
    healthy
    health_status
    usage_status
    remaining_life_percent
    size
    path
    type
    mounted
    firmware
    serial
    entityAsyncStatus
    physical_slot_on_brick
    numa_node
    persistent_memory_type
    host {
      name
      id
      model
      cluster {
        name
        id
        version
        type
        connect_state
        disconnected_reason
        disconnected_date
        stretch
        datacenters {
          name
          id
        }
      }
      zone {
        id
        is_preferred
        datacenter {
          name
          id
        }
      }
      pmem_dimms {
        id
        name
        local_id
      }
    }
    partitions {
      size
      usage
      used_size
    }
    pmem_dimms {
      id
      local_id
      name
      health_status
      numa_node
      device_locator
      remaining_life_percent
      capacity
      part_number
      version
    }
    physical_slot_on_brick
  }
  brickTopoes(
    where: { node_topoes_some: { host: { disks_some: { id: $id } } } }
  ) {
    id
    name
    disk_layout {
      phase
      row
      column
      direction
    }
    capacity {
      row
      column
    }
  }
}

query getDiskFailureInformation($id: ID!) {
  disk(where: { id: $id }) {
    id
    name
    path
    failure_information {
      chunk_errflag
      chunk_warnflag
      iostat_latency
      iostat_latency_ms
      smart_check
      chunk_io_error
      chunk_checksum_error
    }
  }
}

query getDiskUnmountInfo($where: DiskWhereUniqueInput!) {
  disk(where: $where) {
    id
    type
    path
    model
    size
    name
    usage
    numa_node
    host {
      name
      id
      lsm_cap_disk_safe_umount
      cluster {
        id
        used_data_space
        valid_data_space
        recover_data_size
        hosts {
          id
          total_data_capacity
          valid_data_space
          used_data_space
        }
      }
      disks {
        id
        usage
        usage_status
        partitions {
          usage
        }
      }
      pmem_dimms {
        id
        name
        local_id
        version
        numa_node
      }
    }
    pmem_dimms {
      id
      local_id
      version
      numa_node
    }
    partitions {
      used_size
    }
  }
}

query getDiskMountInfo($where: DiskWhereUniqueInput!) {
  disk(where: $where) {
    id
    type
    path
    model
    size
    name
    recommended_usage
    numa_node
    usage
    host {
      id
      name
      is_os_in_raid1
      with_faster_ssd_as_cache
      cluster {
        id
        name
        type
        version
        max_physical_data_capacity
      }
      disks {
        id
        function
      }
      pmem_dimms {
        id
        name
        local_id
        version
        numa_node
      }
    }
    pmem_dimms {
      id
      name
      local_id
      version
      numa_node
    }
  }
}

query getDisksName($where: DiskWhereInput!) {
  disks(where: $where) {
    id
    serial
    name
    host {
      id
      local_id
      name
      scvm_name
    }
  }
}

query getDisksSize($where: DiskWhereInput!) {
  disks(where: $where) {
    id
    size
  }
}

mutation mountDisk($where: DiskWhereUniqueInput!, $function: DiskFunction) {
  updateDisk(
    where: $where
    data: { usage_status: MOUNTING, function: $function }
  ) {
    id
    usage_status
    entityAsyncStatus
  }
}

mutation unmountDisk($where: DiskWhereUniqueInput!) {
  updateDisk(where: $where, data: { usage_status: UNMOUNTING }) {
    id
    usage_status
    entityAsyncStatus
  }
}

query diskStatistics($hostId: ID!, $clusterId: ID!) {
  clusterMountedDiskCount: disksConnection(
    where: {
      usage_status: MOUNTED
      usage_not: BOOT
      host: { cluster: { id: $clusterId } }
    }
  ) {
    aggregate {
      count
    }
  }
  hostDisks: disks(where: { usage_not: BOOT, host: { id: $hostId } }) {
    id
    usage_status
    partitions {
      usage
    }
  }
}

query diskMetricTab($where: DiskWhereUniqueInput!) {
  disk(where: $where) {
    id
    name
    local_id
    host {
      id
      local_id
      cluster {
        id
        hypervisor
      }
    }
  }
}

query unmountedAndMountedDisks($where: DiskWhereInput!) {
  unmountedDisks: disks(
    where: {
      AND: [
        { entityAsyncStatus: null, usage_not: BOOT, usage_status: UNMOUNTED }
        $where
      ]
    }
  ) {
    id
    path
    type
    usage_status
    health_status
    host {
      name
      id
      cluster {
        name
        id
      }
    }
  }
  mountedDisks: disks(
    where: {
      AND: [
        { entityAsyncStatus: null, usage_not: BOOT, usage_status: MOUNTED }
        $where
      ]
    }
  ) {
    id
    path
    type
    usage_status
    health_status
    partitions {
      usage
    }
    host {
      name
      id
      cluster {
        name
        id
      }
    }
  }

  disks(where: { AND: [{ usage_not: BOOT }, $where] }) {
    id
    path
    type
    usage_status
    health_status
    partitions {
      usage
    }
    host {
      name
      id
      cluster {
        name
        id
      }
    }
  }
}
