query contentLibraryVmTemplateBasic(
  $where: ContentLibraryVmTemplateWhereUniqueInput!
) {
  contentLibraryVmTemplate(where: $where) {
    id
    name
    description
    cloud_init_supported
    entityAsyncStatus
    clusters {
      id
      name
      connect_state
      version
      type
      stretch
    }
    architecture
    vm_templates {
      id
      vm_nics {
        index
      }
      vm_disks {
        index
        storage_policy_uuid
      }
      cluster {
        id
        local_id
      }
    }
  }
}

query contentLibraryVmTemplateInfo(
  $where: ContentLibraryVmTemplateWhereUniqueInput!
) {
  contentLibraryVmTemplate(where: $where) {
    id
    name
    size
    description
    createdAt
    vcpu
    memory
    cloud_init_supported
    entityAsyncStatus
    os
    architecture
    vm_templates {
      id
      name
      cpu_model
      clock_offset
      win_opt
      video_type
      io_policy
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      cpu {
        cores
        sockets
      }
      vm_nics {
        index
      }
      vm_disks {
        boot
        type
        bus
        path
        size
        disk_name
        elf_image_local_id
        vm_volume_local_id
        svt_image_local_id
        index
        disabled
        storage_policy_uuid
        max_iops
        max_iops_policy
        max_bandwidth
        max_bandwidth_policy
      }
      cluster {
        id
        name
        version
        type
        connect_state
      }
    }
  }
}

mutation updateContentLibraryVmTemplate(
  $data: ContentLibraryVmTemplateUpdateInput!
  $where: ContentLibraryVmTemplateWhereUniqueInput!
) {
  updateContentLibraryVmTemplate(data: $data, where: $where) {
    id
  }
}

query checkContentLibraryVmTemplatebyName(
  $where: ContentLibraryVmTemplateWhereInput
) {
  contentLibraryVmTemplates(where: $where, first: 1) {
    id
  }
}

mutation deleteContentLibraryVmTemplate(
  $where: ContentLibraryVmTemplateWhereUniqueInput!
) {
