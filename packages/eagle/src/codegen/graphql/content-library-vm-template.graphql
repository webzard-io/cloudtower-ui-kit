}

query contentLibraryVmTemplateForCreateVm(
  $where: ContentLibraryVmTemplateWhereUniqueInput!
) {
  contentLibraryVmTemplate(where: $where) {
    id
    name
    template_config {
      cpu_exclusive_expected_enabled
    }
    clusters {
      id
      name
      version
      type
      vhost_enabled
      stretch
      architecture
    }
    vm_templates {
      id
      name
      vcpu
      description
      cpu {
        cores
        sockets
      }
      memory
      ha
      firmware
      clock_offset
      cpu_model
      win_opt
      io_policy
      max_iops
      max_iops_policy
      max_bandwidth
      max_bandwidth_policy
      cloud_init_supported
      vm_disks {
        boot
        type
        bus
        path
        size
        disk_name
        elf_image_local_id
        vm_volume_local_id
        svt_image_local_id
        index
        disabled
        max_iops
        max_iops_policy
        max_bandwidth
        max_bandwidth_policy
        storage_policy_uuid
      }
      vm_nics {
        index
        mac_address
        enabled
        mirror
        model
        vlan {
          vlan_local_id
          vlan_id
        }
        ingress_rate_limit_burst_in_bit
        ingress_rate_limit_enabled
        ingress_rate_limit_max_rate_in_bitps
        egress_rate_limit_burst_in_bit
        egress_rate_limit_enabled
        egress_rate_limit_max_rate_in_bitps
      }
      cluster {
        id
        local_id
      }
    }
  }
}

mutation abortDistributeContentLibraryVmTemplate($task_id: String!) {
  abortDistributeContentLibraryVmTemplate(task_id: $task_id) {
    id
  }
}

query contentLibraryVmTemplateForConvertVm(
