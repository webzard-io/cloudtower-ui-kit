query queryBasicClusterImages(
  $where: ClusterImageWhereInput
  $orderBy: ClusterImageOrderByInput
) {
  clusterImages(where: $where, orderBy: $orderBy) {
    id
    version
    upgrade_tool_version
    upgrade_from
    cluster {
      id
      name
      ip
      version
      type
      upgrade_tool_version
      hosts {
        id
        name
        os_version
        host_state {
          state
        }
      }
    }
  }
}

mutation createClusterImagesBatch($data: ClusterImagesBatchCreateInput!) {
  createClusterImagesBatch(data: $data) {
    upload_image_task {
      id
      chunk_size
      current_chunk
    }
    images {
      id
    }
  }
}

mutation uploadClusterImage($data: UploadClusterImageInput!) {
  uploadClusterImage(data: $data) {
    id
    current_chunk
    status
  }
}

query queryLowerVersionCluster($version: String!) {
  clusters: clusterImages(where: { version: $version }) {
    cluster {
      id
    }
  }
}

query getClusterImagesVersionByClusterId($clusterId: ID!) {
  clusterImages(where: { cluster: { id: $clusterId } }) {
    id
    version
  }
}

mutation deleteClusterImage($where: ClusterImageWhereUniqueInput!) {
  deleteClusterImage(where: $where) {
    id
  }
}

mutation deleteManyClusterImages($where: ClusterImageWhereInput) {
  deleteManyClusterImages(where: $where) {
    count
  }
}

query queryUpgradeClusterPrecheck($where: UpgradeClusterInput!) {
  upgradeClusterPrecheck(where: $where) {
    canUpgrade
  }
}
mutation upgradeCluster($where: UpgradeClusterInput!) {
  upgradeCluster(where: $where) {
    taskId
    cluster {
      id
    }
  }
}

query getImageVersionById($id: ID!) {
  clusterImage(where: { id: $id }) {
    version
  }
}
