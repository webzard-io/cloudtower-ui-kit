query backupStoreRepositoryBasic(
  $where: BackupStoreRepositoryWhereUniqueInput!
) {
  backupStoreRepository(where: $where) {
    id
    name
    entityAsyncStatus
    backup_plans {
      id
      name
    }
    backup_service {
      id
      name
      status
    }
  }
}

query backupStoreRepositoryInfo(
  $where: BackupStoreRepositoryWhereUniqueInput!
) {
  backupStoreRepository(where: $where) {
    id
    name
    description
    backup_service {
      id
      name
    }
    type
    nfs_server
    nfs_path
    total_capacity
    used_data_space
    valid_data_space
    iscsi_target_iqn
    iscsi_lun_id
    iscsi_chap_name
    iscsi_chap_secret
    iscsi_port
    iscsi_ip
  }
}

query backupStoreRepositoryForUpdate(
  $where: BackupStoreRepositoryWhereUniqueInput!
) {
  backupStoreRepository(where: $where) {
    id
    name
    description
    backup_service {
      id
      name
    }
    type
    nfs_server
    nfs_path
    iscsi_port
    iscsi_ip
    iscsi_target_iqn
    iscsi_lun_id
    iscsi_chap_name
    iscsi_chap_secret
  }
}

mutation updateBackupStoreRepository(
  $where: BackupStoreRepositoryWhereUniqueInput!
  $data: BackupStoreRepositoryUpdateInput!
) {
  updateBackupStoreRepository(where: $where, data: $data) {
    id
    entityAsyncStatus
  }
}

query checkBackupStoreRepositoryName(
  $where: BackupStoreRepositoryWhereInput
  $first: Int = 1
) {
  backupStoreRepositories(where: $where, first: $first) {
    id
  }
}

mutation createBackupStoreRepository($data: BackupStoreRepositoryCreateInput!) {
  createBackupStoreRepository(data: $data) {
    id
  }
}
