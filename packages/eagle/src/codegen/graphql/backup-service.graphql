query getBackupServiceInfo($where: BackupServiceWhereUniqueInput!) {
  backupService(where: $where) {
    id
    name
    description
    status
    running_vm {
      id
      name
      vcpu
      memory
      cpu_usage
      memory_usage
      host {
        id
        name
      }
      cluster {
        id
        name
      }
    }
    management_network_ip
    management_network_subnet_mask
    management_network_gateway
    management_network_vlan
    storage_network_type
    storage_network_ip
    storage_network_subnet_mask
    storage_network_gateway
    storage_network_vlan
    backup_network_type
    backup_network_ip
    backup_network_subnet_mask
    backup_network_gateway
    backup_network_vlan
  }
}

query getBackupServiceForUpdate($where: BackupServiceWhereUniqueInput!) {
  backupService(where: $where) {
    id
    name
    status
    max_parallel_backup_jobs
    max_parallel_restore_jobs
    max_job_retry_times
    backup_wr_iops_max
    backup_rd_iops_max
    restore_wr_iops_max
    restore_rd_iops_max
  }
}
