query nvmfNamespaceBasic($where: NvmfNamespaceWhereUniqueInput!) {
  nvmfNamespace(where: $where) {
    id
    name
    namespace_id
    is_shared
    zbs_volume_id
    nvmf_subsystem {
      id
      name
      cluster {
        id
        name
        connect_state
        disconnected_reason
        disconnected_date
        type
        version
        license_type
        license_expire_date
        nvmf_enabled
        software_edition
        hosts {
          id
          name
          data_ip
        }
        settings {
          id
          enabled_iscsi
        }
      }
    }
    consistency_group {
      id
      name
    }
  }
}

query nvmfNamespaceInfo($where: NvmfNamespaceWhereUniqueInput!) {
  nvmfNamespace(where: $where) {
    id
    name
    namespace_id
    replica_num
    assigned_size
    unique_size
    shared_size
    thin_provision
    stripe_num
    stripe_size
    is_shared
    iops
    iops_rd
    iops_wr
    bps
    bps_rd
    bps_wr
    iops_max
    iops_max_length
    iops_rd_max
    iops_rd_max_length
    iops_wr_max
    iops_wr_max_length
    bps_max
    bps_max_length
    bps_rd_max
    bps_rd_max_length
    bps_wr_max
    bps_wr_max_length
    nqn_whitelist
    nvmf_subsystem {
      id
      name
      nqn_whitelist
      policy
      cluster {
        id
        name
        connect_state
        disconnected_reason
        disconnected_date
        version
        type
        datacenters {
          id
          name
        }
      }
    }
    namespace_group {
      id
      name
    }
  }
}

