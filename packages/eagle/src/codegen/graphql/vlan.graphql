query vlan($where: VlanWhereUniqueInput!, $vmsWhere: VmWhereInput!) {
  vlan(where: $where) {
    id
    name
    vlan_id
    local_id
    type
    qos_min_bandwidth
    qos_max_bandwidth
    qos_priority
    qos_burst
    vds {
      id
      bond_mode
      nics {
        id
        speed
        up
        running
        host {
          id
        }
      }
      vlans {
        id
        qos_min_bandwidth
      }
      cluster {
        id
        version
        type
      }
    }
  }
  vmsConnection(where: $vmsWhere) {
    aggregate {
      count
    }
  }
}

query vlanAndHosts($id: ID!) {
  vlan(where: { id: $id }) {
    id
    name
    type
    vlan_id
    gateway_ip
    gateway_subnetmask
    subnetmask
    vds {
      id
      cluster {
        id
        name
        version
        type
        hosts(orderBy: name_ASC) {
          id
          local_id
          name
          vmotion_ip
        }
      }
    }
  }
}

query vlanForDelete(
  $where: VlanWhereUniqueInput!
  $vmsWhere: VmWhereInput!
  $vmsInRecycleBinWhere: VmWhereInput!
  $vmTemplatesWhere: VmTemplateWhereInput!
  $vmSnapshotsWhere: VmSnapshotWhereInput!
) {
  vlan(where: $where) {
    id
    name
    vlan_id
    local_id
    vds {
      id
      cluster {
        id
        version
      }
    }
  }
  vms(where: $vmsWhere, first: 3) {
    id
    local_id
    name
    status
  }
  vmsInRecycleBin: vms(where: $vmsInRecycleBinWhere) {
    id
    local_id
    name
    original_name
    status
  }
  vmsConnection(where: $vmsWhere) {
    aggregate {
      count
    }
  }
  vmTemplates(where: $vmTemplatesWhere) {
    id
    local_id
    name
    vm_nics {
      vlan {
        vlan_local_id
      }
    }
  }
  vmSnapshots(where: $vmSnapshotsWhere) {
    id
    local_id
    name
    vm_nics {
      vlan {
        vlan_local_id
      }
    }
  }
}

query vlanName($where: VlanWhereInput!) {
  vlans(where: $where) {
    id
    name
    local_id
  }
}

query vlansWithLocalId($where: VlanWhereInput!, $orderBy: VlanOrderByInput) {
  vlans(where: $where, orderBy: $orderBy) {
    id
    name
    local_id
    vds {
      id
      name
      cluster {
        id
        architecture
      }
    }
  }
}

mutation createVlan($data: VlanCreateInput!, $effect: UpdateVlanEffect) {
  createVlan(data: $data, effect: $effect) {
    id
  }
}

mutation updateVlan(
  $data: VlanUpdateInput!
  $where: VlanWhereUniqueInput!
  $effect: UpdateVlanEffect
) {
  updateVlan(data: $data, where: $where, effect: $effect) {
    id
    name
    vlan_id
    vds {
      id
    }
  }
}

mutation deleteVlan($where: VlanWhereUniqueInput!) {
  deleteVlan(where: $where) {
    id
  }
}

query getVlanInfo($where: VlanWhereUniqueInput!) {
  vlan(where: $where) {
    id
    name
    type
    vlan_id
    gateway_ip
    subnetmask
    mtu
    entityAsyncStatus
    qos_min_bandwidth
    qos_max_bandwidth
    qos_priority
    qos_burst
    route {
      gateway_ip
      target_ip
      subnet
    }
    vds {
      id
      name
      bond_mode
      nics {
        id
        name
        mac_address
        mtu
        speed
        up
        running
        host {
          id
          name
        }
      }
      cluster {
        id
        name
        connect_state
        disconnected_reason
        disconnected_date
        nvme_over_tcp_enabled
        nvme_over_rdma_enabled
        version
        type
        ip
        management_vip
        iscsi_vip
        hosts(orderBy: name_ASC) {
          id
          local_id
          name
          vmotion_ip
          management_ip
          access_ip
          data_ip
          ipmi {
            id
            ip
          }
        }
      }
      vlans {
        id
        qos_min_bandwidth
      }
    }
    labels {
      id
      key
      value
    }
  }
}

query checkVlanId($where: VlanWhereInput!) {
  vlans(where: $where) {
    id
    vlan_id
    name
  }
}

query getCreateNetworkInfo($where: ClusterWhereUniqueInput!) {
  cluster(where: $where) {
    id
    name
    ip
    management_vip
    iscsi_vip
    rdma_enabled
    version
    type
    hosts(orderBy: name_ASC) {
      id
      local_id
      name
      access_ip
      data_ip
      management_ip
      vmotion_ip
      ipmi {
        id
        ip
      }
    }
  }
}
