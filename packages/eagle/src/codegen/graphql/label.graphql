query getLabels($where: LabelWhereInput = {}, $first: Int, $skip: Int) {
  labels(
    where: { AND: [$where, { key_not_starts_with: "system.cloudtower/" }] }
    first: $first
    skip: $skip
  ) {
    id
    key
    value
    total_num
    datacenters {
      id
      name
    }
    security_policies {
      id
      name
    }
    isolation_policies {
      id
      vm {
        id
        name
      }
    }
  }
}

query getLabel($where: LabelWhereUniqueInput!) {
  label(where: $where) {
    id
    key
    value
    total_num
  }
}

mutation createLabel($data: LabelCreateInput!) {
  createLabel(data: $data) {
    id
    key
    value
  }
}

mutation deleteLabel($where: LabelWhereUniqueInput!) {
  deleteLabel(where: $where) {
    id
  }
}

mutation deleteLabels($where: LabelWhereInput) {
  deleteManyLabels(where: $where) {
    count
  }
}

mutation updateLabel($id: ID!, $data: LabelUpdateInput!) {
  updateLabel(where: { id: $id }, data: $data) {
    id
    key
    value
    datacenters {
      id
      name
      labels {
        id
        key
        value
      }
    }
  }
}

