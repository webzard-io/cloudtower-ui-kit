query getLabelsInSecurityGroup(
  $where: LabelWhereInput = {}
  $first: Int
  $skip: Int
) {
  labels(
    where: { AND: [$where, { key_not_starts_with: "system.cloudtower/" }] }
    first: $first
    skip: $skip
  ) {
    id
    key
    value
    vms {
      id
      name
      vm_usage
      in_recycle_bin
      cluster {
        id
        name
        everoute_cluster {
          id
          name
        }
      }
      vm_nics {
        id
        vlan {
          id
          name
          vds {
            id
            name
            everoute_cluster {
              id
              name
            }
          }
        }
      }
      labels {
        id
        key
        value
      }
    }
  }
  labelsConnection(
    where: { AND: [$where, { key_not_starts_with: "system.cloudtower/" }] }
  ) {
    aggregate {
      count
    }
  }
}
