query getLabelVmVlans($id: ID!, $first: Int, $skip: Int) {
  label(where: { id: $id }) {
    id
    key
    vlans(first: $first, skip: $skip, where: { type: VM }) {
      id
      name
      vds {
        id
        name
        cluster {
          id
          name
        }
      }
    }
  }
  vlansConnection(where: { labels_some: { id: $id }, type: VM }) {
    aggregate {
      count
    }
  }
}

