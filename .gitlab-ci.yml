image: registry.smtx.io/cloudtower/node:16-alpine

stages:
  - build
  - pages

build:
  stage: build
  cache:
    - key: yarn-cache
      paths: 
        - .yarn
    - key: "sp-storybook"
      paths:
        - public
    - key: "node_modules"
      paths:
        - node_modules
  before_script:
    - apk add --no-cache libc6-compat
    - yarn config set cache-folder .yarn
  script:
    - yarn install
    - yarn build
  rules:
    - if: $CI_COMMIT_REF_NAME == "story" || $CI_COMMIT_REF_NAME == "main"

pages:
  variables:
    SSH_PRIVATE_KEY_28_80: $SSH_PRIVATE_KEY_28_80
  stage: pages
  cache:
    - key: yarn-cache
      paths: 
        - .yarn
    - key: "sp-storybook"
      paths:
        - public
    - key: "node_modules"
      paths:
        - node_modules
  before_script:
    - apk add --no-cache libc6-compat
    - which ssh-agent || ( apk add --no-cache openssh-client)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_28_80" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - yarn config set cache-folder .yarn
  script:
    - yarn install
    - yarn build
    - cd story && yarn build-storybook
    - cd .. && cp -r ./story/storybook-static ./public
    - scp -r ./story/storybook-static root@192.168.28.80:~/workspace/

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == "story" || $CI_COMMIT_REF_NAME == "main"
