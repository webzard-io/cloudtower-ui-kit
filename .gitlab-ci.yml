image: registry.smtx.io/cloudtower/node:16-alpine

stages:
  - pages



pages:
  variables:
    SSH_PRIVATE_KEY_28_80: $SSH_PRIVATE_KEY_28_80
  stage: pages
  cache:
    - key: "sp-storybook"
      paths:
        - public
    - key: "node_modules"
      paths:
        - node_modules
  before_script:
    - apk add --no-cache libc6-compat
    - which ssh-agent || ( apk add --no-cache openssh-client)
    # Run ssh-agent (inside the build environment)
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - ssh-add <(echo "$SSH_PRIVATE_KEY_28_80")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - yarn install
    - yarn build
    - cd story && yarn build-storybook
    - cd .. && cp ./story/storybook-static ./public
    - scp -r ./story/storybook-static smartx@http://192.168.28.80/:~/workspace/storybook-static

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == "story" || $CI_COMMIT_REF_NAME == "main"
