image: registry.smtx.io/cloudtower/node:16-alpine

stages:
  - build
  - pages

build:
  stage: build
  script:
    - yarn install
    - yarn build
  rules:
    - if: $CI_COMMIT_REF_NAME == "story" || $CI_COMMIT_REF_NAME == "main"

pages:
  stage: pages
  cache:
    key: "sp-storybook"
    paths:
      - public
  script:
    - cd story && yarn build build-storybook
    - mv story/storybook-static ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == "story" || $CI_COMMIT_REF_NAME == "main"
