image: registry.smtx.io/cloudtower/node:16-alpine

stages:
  - pages

pages:
  stage: pages
  cache:
    key: "sp-storybook"
    paths:
      - public
  before_script:
    - apk add --no-cache libc6-compat
  script:
    - yarn install
    - yarn build
    - cd story && yarn build-storybook
    - cd .. && mv ./story/storybook-static ./public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == "story" || $CI_COMMIT_REF_NAME == "main"
