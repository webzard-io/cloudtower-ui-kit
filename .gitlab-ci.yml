image: registry.smtx.io/cloudtower/node:16-alpine

stages:
  - unit-test
  - packages
  - pages

unit-test:
  stage: unit-test
  cache:
    - key: yarn-cache
      paths:
        - .yarn
    - key: "sp-storybook"
      paths:
        - public
    - key: "node_modules"
      paths:
        - node_modules
  before_script:
    - apk add --no-cache libc6-compat
  script:
    - yarn install --cache-folder=.yarn
    - yarn build

packages:
  variables:
    QINGHUA_CUI_SMARTX_NPM_TOKEN: $QINGHUA_CUI_SMARTX_NPM_TOKEN
  stage: packages
  cache:
    - key: yarn-cache
      paths:
        - .yarn
    - key: "sp-storybook"
      paths:
        - public
    - key: "node_modules"
      paths:
        - node_modules
  before_script:
    - apk add --no-cache libc6-compat
  script:
    - echo //registry.npmjs.org/:_authToken=${QINGHUA_CUI_SMARTX_NPM_TOKEN} > .npmrc
    - yarn install --cache-folder=.yarn
    - yarn lerna version $CI_COMMIT_TAG --exact
    - yarn build
    - yarn lerna publish from-package --no-verify-access --yes
  rules:
    - if: '$CI_COMMIT_TAG'

pages:
  variables:
    SSH_PRIVATE_KEY_28_80: $SSH_PRIVATE_KEY_28_80
  stage: pages
  cache:
    - key: yarn-cache
      paths:
        - .yarn
    - key: "sp-storybook"
      paths:
        - public
    - key: "node_modules"
      paths:
        - node_modules
  before_script:
    - apk add --no-cache libc6-compat
    - which ssh-agent || ( apk add --no-cache openssh-client)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_28_80" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'

  script:
    - yarn install --cache-folder=.yarn
    - yarn build
    - cd story && yarn build-storybook
    - cd .. && cp -r ./story/storybook-static ./public
    - scp -r ./story/storybook-static root@192.168.28.80:~/workspace/

  artifacts:
    paths:
      - public
  only:
    - main
